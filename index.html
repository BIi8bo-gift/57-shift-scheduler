<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>新时代药业 · 57车间排班表</title>
<style>
/* ============================================================
   新时代药业57车间排班表 · 制药精工 设计系统
   Pharma Precision — Clean. Professional. Life-science.
   ============================================================ */

/* ===== DESIGN TOKENS: Light Theme ===== */
:root {
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-bounce: cubic-bezier(0.68,-0.55,0.27,1.55);

  /* Primary — Deep Cyan-Teal */
  --accent:        #0d7b8a;
  --accent-hover:  #0a6470;
  --accent-light:  #e6f4f6;
  --accent-ring:   rgba(13,123,138,.2);

  /* Accent — Warm Amber */
  --amber:         #e0893a;
  --amber-hover:   #c4742b;
  --amber-light:   #fef6ee;

  /* Semantic */
  --green:         #2d8a56;
  --green-hover:   #236e44;
  --green-light:   #eaf7f0;
  --red:           #c44536;
  --red-hover:     #a33629;
  --red-light:     #fef5f3;

  /* Neutrals — subtly warm */
  --gray-50:  #f8f6f2;
  --gray-100: #f0ede7;
  --gray-200: #e4e0d8;
  --gray-300: #d0cbc2;
  --gray-400: #a8a39a;
  --gray-500: #7d7870;
  --gray-600: #5a554e;
  --gray-700: #3b3731;
  --gray-800: #24211c;
  --gray-900: #141210;

  /* Surface */
  --bg:            #f3f0ea;
  --surface:       #ffffff;
  --surface-hover: #faf9f5;
  --text:          var(--gray-800);
  --text-muted:    var(--gray-500);

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(20,18,16,.04);
  --shadow-sm: 0 2px 8px rgba(20,18,16,.06);
  --shadow-md: 0 6px 20px rgba(20,18,16,.08);
  --shadow-lg: 0 16px 48px rgba(20,18,16,.12);

  /* Glass */
  --glass:         rgba(255,255,255,.78);
  --glass-strong:  rgba(255,255,255,.94);
  --glass-border:  rgba(20,18,16,.08);

  /* Typography */
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","HarmonyOS Sans",sans-serif;
  --font-mono: "SF Mono","Cascadia Code","Consolas",monospace;

  /* Spacing (4px grid) */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;

  /* Radius */
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;--r-full:9999px;
}

/* ===== DESIGN TOKENS: Dark Theme ===== */
[data-theme="dark"] {
  --accent:        #3db8cc;
  --accent-hover:  #55c9db;
  --accent-light:  #0f262c;
  --accent-ring:   rgba(61,184,204,.25);
  --amber:         #e89a4f;
  --amber-hover:   #f0b06e;
  --amber-light:   #261d12;
  --green:         #4dbe72;
  --green-hover:   #68d489;
  --green-light:   #121f17;
  --red:           #e06050;
  --red-hover:     #ed7d70;
  --red-light:     #261513;

  --gray-50:  #19191c;
  --gray-100: #212226;
  --gray-200: #2d2e33;
  --gray-300: #3c3d43;
  --gray-400: #696a71;
  --gray-500: #8c8d94;
  --gray-600: #aeaeb5;
  --gray-700: #cccbd1;
  --gray-800: #e2e1e6;
  --gray-900: #f5f4f7;

  --bg:            #111113;
  --surface:       #1b1c20;
  --surface-hover: #232429;
  --text:          var(--gray-800);
  --text-muted:    var(--gray-500);

  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --shadow-md: 0 6px 20px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);

  --glass:         rgba(28,29,34,.82);
  --glass-strong:  rgba(35,37,43,.95);
  --glass-border:  rgba(255,255,255,.07);
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; }
}

/* ===== PRINT ===== */
@media print {
  body{background:#fff!important;padding:8px;color:#000;}
  .bar-wrap,.info,.m,.msg,.bar,.btn-o,.btn-sm,.btn-p,.btn-g{display:none!important;}
  .wrap{box-shadow:none;border:1px solid #ccc;max-width:100%;overflow:visible;max-height:none;}
  table{font-size:11px}
  th,td{border:1px solid #999;color:#000!important;padding:6px 8px}
  h1{color:#000;font-size:20px}
}

/* ===== KEYFRAMES ===== */
@keyframes fadeSlideUp {
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes scaleIn {
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}
@keyframes pulseDot {
  0%,100%{opacity:1}
  50%{opacity:.35}
}
@keyframes rowIn {
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes shimmer {
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}

/* ===== GLOBAL RESET ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{font-size:16px;scroll-behavior:smooth}

body{
  font-family:var(--font);
  background:transparent;
  color:var(--text);
  padding:var(--sp-10) var(--sp-4) var(--sp-8);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.6;
  min-height:100vh;
  position:relative;
}

/* Layer 1: Base color + pharmaceutical glow */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 8% 5%, rgba(13,123,138,.24) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 90% 80%, rgba(45,138,86,.18) 0%, transparent 50%),
    radial-gradient(ellipse 55% 45% at 50% 110%, rgba(224,137,58,.12) 0%, transparent 45%),
    radial-gradient(ellipse 40% 35% at 80% 10%, rgba(13,123,138,.08) 0%, transparent 40%),
    var(--bg);
  pointer-events:none;z-index:-3;
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(ellipse 70% 55% at 8% 5%, rgba(61,184,204,.18) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 90% 80%, rgba(77,190,114,.12) 0%, transparent 50%),
    radial-gradient(ellipse 55% 45% at 50% 110%, rgba(232,154,79,.08) 0%, transparent 45%),
    radial-gradient(ellipse 40% 35% at 80% 10%, rgba(61,184,204,.06) 0%, transparent 40%),
    var(--bg);
}

/* Top brand bar */
.brand-bar{
  position:fixed;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-hover) 25%,var(--green) 50%,var(--amber) 75%,var(--accent) 100%);
  background-size:200% 100%;
  z-index:9999;
  animation:brandShimmer 6s linear infinite;
}
@keyframes brandShimmer{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}

/* Layer 2: Large "57" watermark */
.workshop-watermark{
  position:fixed;
  right:2vw;
  bottom:1vh;
  font-size:24vw;
  font-weight:900;
  font-family:var(--font);
  color:rgba(13,123,138,.07);
  line-height:.8;
  letter-spacing:-0.08em;
  pointer-events:none;
  z-index:-2;
  user-select:none;
  text-shadow:0 0 80px rgba(13,123,138,.04);
}
.workshop-watermark.left{
  right:auto;
  left:2vw;
  top:5vh;
  bottom:auto;
  font-size:14vw;
  color:rgba(45,138,86,.05);
  transform:rotate(-12deg);
}
[data-theme="dark"] .workshop-watermark{
  color:rgba(61,184,204,.08);
}
[data-theme="dark"] .workshop-watermark.left{
  color:rgba(77,190,114,.06);
}

  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360'><g opacity='0.22'><polygon fill='none' stroke='%230d7b8a' stroke-width='1.3' points='30,25 52,12 74,25 74,51 52,64 30,51'/><circle cx='30' cy='25' r='3' fill='%230d7b8a'/><circle cx='52' cy='12' r='3' fill='%230d7b8a'/><circle cx='74' cy='25' r='3' fill='%230d7b8a'/><circle cx='74' cy='51' r='3' fill='%230d7b8a'/><circle cx='52' cy='64' r='3' fill='%230d7b8a'/><circle cx='30' cy='51' r='3' fill='%230d7b8a'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='74' y1='51' x2='110' y2='75'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='52' y1='64' x2='90' y2='115'/><text x='92' y='90' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%230d7b8a' opacity='0.4'>57</text><polygon fill='none' stroke='%230d7b8a' stroke-width='1.3' points='250,200 272,187 294,200 294,226 272,239 250,226'/><circle cx='250' cy='200' r='3' fill='%230d7b8a'/><circle cx='272' cy='187' r='3' fill='%230d7b8a'/><circle cx='294' cy='200' r='3' fill='%230d7b8a'/><circle cx='294' cy='226' r='3' fill='%230d7b8a'/><circle cx='272' cy='239' r='3' fill='%230d7b8a'/><circle cx='250' cy='226' r='3' fill='%230d7b8a'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='220' y1='200' x2='250' y2='200'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='294' y1='226' x2='310' y2='260'/><rect fill='none' stroke='%232d8a56' stroke-width='1.2' x='15' y='130' width='48' height='18' rx='9'/><rect x='15' y='130' width='24' height='18' rx='9' fill='%232d8a56' opacity='0.3'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='39' y1='130' x2='39' y2='148'/><rect fill='none' stroke='%23e0893a' stroke-width='1.2' x='280' y='40' width='52' height='18' rx='9' transform='rotate(25 306 49)'/><rect x='280' y='40' width='26' height='18' rx='9' fill='%23e0893a' opacity='0.3' transform='rotate(25 306 49)'/><line x1='306' y1='40' x2 175' y1='120' x2='185' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='165' y1='120' x2='165' y2='135'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='175' y1='120' x2='175' y2='135'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='155' y1='135' x2='185' y2='135'/></g></svg>");
  background-size:360px 360px;
  pointer-events:none;z-index:-1;
}
[data-theme="dark"] body::after{
  opacity:.6;
}

/* ===== CUSTOM SCROLLBAR ===== */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--gray-300)}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

/* ===== HEADER ===== */
h1{
  font-size:2rem;
  font-weight:800;
  letter-spacing:-.03em;
  margin:0 0 var(--sp-2);
  color:var(--gray-900);
  line-height:1.1;
  text-align:center;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-hover) 50%,var(--amber) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
[data-theme="dark"] h1{
  background:linear-gradient(135deg,var(--accent) 0%,#7dd3e8 50%,var(--amber) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.info{
  font-size:.8125rem;
  color:var(--text-muted);
  margin:0 0 var(--sp-6);
  line-height:1.7;
  text-align:center;
  letter-spacing:.01em;
  max-width:500px;
  margin-left:auto;margin-right:auto;
}

/* ===== TOOLBAR ===== */
.bar-wrap{
  background:var(--surface);
  border-radius:var(--r-lg);
  padding:var(--sp-4);
  margin-bottom:var(--sp-4);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-100);
}

.bar{
  display:flex;
  gap:var(--sp-2);
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}

.bar label{
  font-weight:600;
  font-size:.75rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  user-select:none;
}

/* ===== FORM INPUTS ===== */
.inp{
  height:36px;
  padding:0 12px;
  border:1.5px solid var(--gray-200);
  border-radius:var(--r-md);
  font-size:.8125rem;
  font-family:var(--font);
  background:var(--gray-50);
  color:var(--text);
  transition:all 180ms var(--ease-out);
  outline:none;
}
.inp:hover{border-color:var(--gray-300);background:var(--surface)}
.inp:focus{
  border-color:var(--accent);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-ring);
}

/* Custom select arrow */
select.inp{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237d7870' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:28px;cursor:pointer;
}
[data-theme="dark"] select.inp{
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238c8d94' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:36px;padding:0 16px;border:none;
  border-radius:var(--r-md);
  font-size:.8125rem;font-weight:600;font-family:var(--font);
  cursor:pointer;user-select:none;white-space:nowrap;
  letter-spacing:.01em;outline:none;
  transition:all 160ms var(--ease-out);
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:scale(.95)}

/* Primary */
.btn-p{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
}
.btn-p:hover{
  background:var(--accent-hover);
  box-shadow:0 4px 12px rgba(13,123,138,.3);
  transform:translateY(-1px);
}
.btn-p:active{transform:scale(.95) translateY(0)}

/* Success / Export */
.btn-g{
  background:var(--green);color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
}
.btn-g:hover{
  background:var(--green-hover);
  box-shadow:0 4px 12px rgba(45,138,86,.3);
  transform:translateY(-1px);
}
.btn-g:active{transform:scale(.95) translateY(0)}

/* Outline */
.btn-o{
  background:var(--surface);border:1.5px solid var(--gray-200);color:var(--gray-600);
}
.btn-o:hover{
  background:var(--gray-50);border-color:var(--gray-300);color:var(--gray-700);
}

/* Small */
.btn-sm{height:30px;padding:0 10px;font-size:.75rem}

/* ===== CHECKBOXES ===== */
input[type=checkbox]{
  width:17px;height:17px;
  accent-color:var(--accent);cursor:pointer;
  border-radius:4px;
}

/* ===== STATUS TEXT ===== */
#st,#rangeInfo,#selInfo{font-size:.75rem;color:var(--text-muted)}

/* ===== TABLE CONTAINER ===== */
.wrap{
  background:var(--surface);
  border-radius:var(--r-lg);
  overflow:auto;
  margin:0 auto var(--sp-4);
  max-width:1200px;width:100%;
  box-shadow:var(--shadow-md);
  max-height:calc(100vh - 220px);
  border:1px solid var(--gray-100);
  position:relative;
}

/* Subtle inner border glow on the container */
.wrap::before{
  content:'';
  position:absolute;inset:0;
  border-radius:var(--r-lg);
  border:1px solid rgba(13,123,138,.06);
  pointer-events:none;z-index:1;
}

/* ===== TABLE ===== */
table{
  width:100%;border-collapse:collapse;
  font-size:.875rem;font-family:var(--font);
  font-variant-numeric:tabular-nums;
}

th,td{
  padding:10px 10px;text-align:center;vertical-align:middle;
  border-bottom:1px solid var(--gray-100);
}

/* Header cells */
th{
  white-space:nowrap;
  font-size:.75rem;font-weight:700;
  color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.04em;
  background:var(--gray-50);
  position:sticky;top:0;z-index:20;
  border-top:none;
}

/* Data cells */
td{
  white-space:normal;word-break:break-word;max-width:160px;
  transition:background 100ms var(--ease-out);
}

/* First column (date) */
td:first-child{
  white-space:nowrap;max-width:none;
  font-weight:700;color:var(--gray-700);
  font-variant-numeric:tabular-nums;
}

tr:last-child td{border-bottom:none}

/* Row hover */
@media(hover:hover){
  tbody tr:hover td{background:var(--surface-hover)!important}
}

/* Alternating row subtle striping */
tbody tr:nth-child(even) td{background:rgba(248,246,242,.5)}
[data-theme="dark"] tbody tr:nth-child(even) td{background:rgba(26,27,31,.4)}

/* ===== SELECT MODE ===== */
.cbtd,.cbth{display:none}

body.selmode .cbth{
  display:table-cell;position:sticky;left:0;z-index:11;
  background:var(--gray-50);width:36px;min-width:36px;
}
body.selmode .cbtd{
  display:table-cell;position:sticky;left:0;z-index:6;
  background:var(--surface);width:36px;min-width:36px;
}
body.selmode td:nth-child(2){
  position:sticky;left:36px;z-index:5;
  background:var(--surface);min-width:105px;white-space:nowrap;
}
body.selmode th:nth-child(2){
  position:sticky;left:36px;z-index:10;min-width:105px;
}

/* Select mode — highlight */
body.selmode tbody tr:hover td{background:rgba(13,123,138,.04)!important}

/* ===== RENAME INDICATOR ===== */
.rn{
  cursor:pointer;
  border-bottom:2px dashed var(--gray-300);
  padding-bottom:1px;
  transition:all 150ms var(--ease-out);
}
.rn:hover{color:var(--accent);border-color:var(--accent)}

/* ===== CLICKABLE CELL ===== */
.cl{
  cursor:pointer;min-height:36px;line-height:1.7;
  transition:filter 120ms var(--ease-out);border-radius:3px;
}
@media(hover:hover){.cl:hover{filter:brightness(.94)}}
[data-theme="dark"] .cl:hover{filter:brightness(1.14)}

/* ===== TAGS ===== */
.tg{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:var(--r-sm);
  font-size:.6875rem;margin:1px;
  white-space:nowrap;font-weight:600;
  line-height:1.5;letter-spacing:.01em;
  transition:all 120ms var(--ease-out);
  box-shadow:0 1px 0 rgba(0,0,0,.06);
}
.tg:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* Force shift tag */
.tg-force{
  background:var(--red)!important;color:#fff!important;
  font-weight:700!important;
  box-shadow:0 2px 8px rgba(196,69,54,.4)!important;
  animation:pulseDot 2s var(--ease-out) infinite;
}

/* ===== TOAST ===== */
.msg{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--gray-800);color:#f0eeea;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:12px 28px;border-radius:var(--r-full);
  font-size:.8125rem;font-weight:600;
  z-index:300;opacity:0;pointer-events:none;
  font-family:var(--font);
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.08);
  transition:opacity 180ms var(--ease-out),transform 250ms var(--ease-spring);
  letter-spacing:.01em;
}
.msg.sh{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MODAL OVERLAY ===== */
.m{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(10,9,7,.45);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity 220ms var(--ease-out);
}
[data-theme="dark"] .m{background:rgba(0,0,0,.6)}
.m.s{opacity:1;pointer-events:auto}

/* ===== MODAL DIALOG ===== */
.md{
  background:var(--surface);
  border-radius:var(--r-xl);
  padding:var(--sp-5);
  width:400px;max-width:calc(100vw - 32px);
  max-height:85vh;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--gray-100);
  transform:scale(.93) translateY(20px);
  transition:transform 350ms var(--ease-spring),opacity 220ms var(--ease-out);
  opacity:0;
}
.m.s .md{transform:scale(1) translateY(0);opacity:1}

.md h3{
  font-size:1.0625rem;font-weight:700;
  margin-bottom:var(--sp-1);
  color:var(--gray-800);
  letter-spacing:-.01em;
}
.md .h{
  font-size:.75rem;color:var(--text-muted);
  margin-bottom:var(--sp-3);line-height:1.5;
}

/* Modal chip grid */
.md .g{
  display:flex;flex-wrap:wrap;gap:8px;
  overflow-y:auto;max-height:280px;
  padding:var(--sp-2) 0;
}
.md .g>div{
  padding:8px 18px;border-radius:var(--r-full);
  border:1.5px solid var(--gray-200);
  font-size:.8125rem;font-weight:500;
  cursor:pointer;user-select:none;
  transition:all 180ms var(--ease-out);
  color:var(--gray-700);background:var(--surface);
  box-shadow:var(--shadow-xs);
  position:relative;
}
.md .g>div:active{transform:scale(.94)}
@media(hover:hover){
  .md .g>div:hover{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 2px 8px var(--accent-ring);
    transform:translateY(-1px);
  }
}
.md .g .s{
  background:var(--accent)!important;border-color:var(--accent)!important;
  color:#fff!important;font-weight:600!important;
  box-shadow:0 3px 12px rgba(13,123,138,.35)!important;
}
@media(hover:hover){.md .g .s:hover{box-shadow:0 4px 16px rgba(13,123,138,.45)!important;color:#fff!important;background:var(--accent-hover)!important;}}
.md .g .d{opacity:.25;cursor:default;pointer-events:none}
.md .g .fd{
  opacity:.65;cursor:pointer;
  border-style:dashed!important;border-color:var(--red)!important;
  color:var(--red)!important;background:var(--red-light)!important;
}
.md .g .fd:hover{opacity:1;background:rgba(196,69,54,.12)!important;border-color:var(--red)!important;box-shadow:0 2px 8px rgba(196,69,54,.25)!important;}

/* 芯片右上角 ✕ 删除 */
.chip-x{
  display:inline-block;margin-left:4px;
  font-size:11px;font-weight:700;
  color:inherit;opacity:0.35;
  cursor:pointer;transition:opacity 120ms;
  padding:0 1px;
  vertical-align:middle;
  line-height:1;
}
.chip-x:hover{opacity:1!important;}
.md .g .s .chip-x{color:#fff;opacity:0.7;}
.md .g .s .chip-x:hover{opacity:1;}
.md .g .fd .chip-x{color:var(--red);opacity:0.5;}
.md .g .fd .chip-x:hover{opacity:1;}

/* Modal description bar */
.md .mh{
  display:flex;align-items:center;gap:8px;
  margin-bottom:var(--sp-3);
}
.md .mh .mh-icon{
  width:32px;height:32px;flex-shrink:0;
  border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  background:var(--accent-light);
  color:var(--accent);
}

/* Modal input row */
.md .ab{
  display:flex;gap:var(--sp-2);margin-top:var(--sp-3);
}
.md .ab input{
  flex:1;height:40px;padding:0 14px;
  border:1.5px solid var(--gray-200);border-radius:var(--r-md);
  font-size:.8125rem;font-family:var(--font);
  background:var(--surface);color:var(--text);
  transition:all 180ms var(--ease-out);outline:none;
}
.md .ab input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);
  background:var(--surface);
}
.md .ab input:hover{
  border-color:var(--gray-300);
}

/* Modal footer */
.md .bt{
  display:flex;gap:var(--sp-2);margin-top:var(--sp-3);
  justify-content:flex-end;
  border-top:1px solid var(--gray-100);padding-top:var(--sp-3);
}

/* Stats table in modal */
.md .g table th{font-size:.6875rem;padding:6px 8px;background:var(--gray-50)}

/* ===== 管理弹窗列表 ===== */
.md .g table td{font-size:.8125rem;padding:6px 8px}

/* ===== BOTTOM BAR ===== */
body > div:last-of-type.bar{
  padding:var(--sp-1) 0;
}
body > div:last-of-type.bar .btn-g{
  font-size:.875rem;padding:0 24px;height:40px;border-radius:var(--r-lg);
}

/* ===== EMPTY STATE ===== */
#tb tr:only-child td[colspan]{
  color:var(--gray-400)!important;
  font-style:italic;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  body{padding:var(--sp-6) var(--sp-3) var(--sp-6)}
  h1{font-size:1.5rem}
  .bar-wrap{padding:var(--sp-3);border-radius:var(--r-md)}
  .bar{gap:var(--sp-1)}
  .wrap{border-radius:var(--r-md);max-height:calc(100vh - 180px);overflow:auto}
  table{font-size:.8125rem}
  th,td{padding:8px 6px}
  .md{width:calc(100vw - 32px);padding:var(--sp-4);border-radius:var(--r-lg)}

}

  .inp{font-size:.6875rem;height:30px;padding:0 8px}
  .btn{font-size:.6875rem;height:30px;padding:0 10px}
  select.inp{background-position:right 6px center;padding-right:22px}
}

th[style*="color:#fff"]{color:#fff!important}

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
'use strict';

var D = {people:[], batch:[], work:[], rows:[]};

// ===== 云端存储 (jsonblob.com) =====
var CLOUD_URL = 'https://jsonblob.com/api/jsonBlob/';
var CLOUD_BLOB_ID = '019f8f85-33d8-7724-b8c7-6a0fa4ff566e';

function getBlobId() {
  return localStorage.getItem('s57blob') || CLOUD_BLOB_ID;
}

function cloudSave() {
  var blobId = getBlobId();
  fetch(CLOUD_URL + blobId, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({data: D, ts: Date.now()})
  }).then(function(r) {
    if (r.status === 404 || r.status === 410) {
      // Blob过期，创建新的
      return fetch(CLOUD_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({data: D, ts: Date.now()})
      }).then(function(r2) {
        var loc = r2.headers.get('Location');
        if (loc) {
          var newId = loc.split('/').pop();
          localStorage.setItem('s57blob', newId);
        }
      });
    }
  }).catch(function(){});
}

function cloudLoad(cb) {
  var blobId = getBlobId();
  fetch(CLOUD_URL + blobId).then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    if (data && data.data && data.data.people) {
      cb(data.data, data.ts || 0);
    }
  }).catch(function(){});
}

function initD() {
  try { var r = localStorage.getItem('s57v2'); if (r) { var d = JSON.parse(r); if (d && d.people) { D = d; if(!D.colHeaders) D.colHeaders={}; return; } } } catch(e){}
  D = {
    people: ['王征征','林新燕','王晓龙','李振','王学灵','崔国干','常远','孙文斌','朱庆强','张峰','毛志琛'],
    batch: ['LNF2529','利妥昔','LNF2501'],
    colHeaders: {e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'},
    work: ['2500L培养','500L培养','100L培养','WAVE培养','配离心缓冲液','下罐离心','补料A/B配液','纯化','碟片离心','深层过滤','清场记录','收获'],
    rows: []
  };
}
initD();

function save() {
  try { localStorage.setItem('s57v2', JSON.stringify(D)); localStorage.setItem('s57ts', String(Date.now())); } catch(e){}
  // 自动保存到云端（防抖）
  if(window._saveTimer) clearTimeout(window._saveTimer);
  window._saveTimer=setTimeout(cloudSave, 500);
}

// 页面加载时：localStorage优先，没有数据再从云端恢复
(function(){
  var hasLocal=false;
  try { hasLocal=!!localStorage.getItem('s57v2'); } catch(e){}
  if(hasLocal) {
    // 有本地数据，后台静默同步云端（如果有更新的数据）
    cloudLoad(function(data, cloudTs){
      var localTs = parseInt(localStorage.getItem('s57ts') || '0');
      if (cloudTs > localTs) {
        D = data;
        if(!D.colHeaders) D.colHeaders={};
        localStorage.setItem('s57v2', JSON.stringify(D));
        localStorage.setItem('s57ts', String(cloudTs));
        render();
        msg('已同步云端最新数据');
      }
    });
    return;
  }

  // 首次访问或无本地数据，尝试从云端恢复
  cloudLoad(function(data, cloudTs){
    D=data;
    if(!D.colHeaders) D.colHeaders={};
    localStorage.setItem('s57v2', JSON.stringify(D));
    localStorage.setItem('s57ts', String(cloudTs));
    render();
    msg('已恢复云端保存的数据');
  });
})();
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function sl(d){return d.replace(/-/g,'/')}

function msg(m){
  var e=$('msg');e.textContent=m;e.className='msg sh';
  clearTimeout(window._mt);window._mt=setTimeout(function(){e.className='msg'},2500);
}

var _ctx = null;
var _mgr = null;

// ===== 表头批号 =====
function drawH(){
  for(var i=0;i<3;i++){
    var e=$('h'+i);if(!e)continue;
    e.innerHTML='<span class="rn" onclick="renB('+i+')">'+esc(D.batch[i]||'批号'+(i+1))+'</span>';
  }
  // 恢复班次列名
  if(D.colHeaders){
    var keys=['e','mb','mp','s1','s2','bn','of'];
    for(var i=0;i<keys.length;i++){
      var el=$('hdr_'+keys[i]);
      if(el && D.colHeaders[keys[i]]) el.textContent=D.colHeaders[keys[i]];
    }
  }
}
function renB(i){
  var o=D.batch[i]||'批号'+(i+1);
  customPrompt('输入新批号名称：',o,function(n){
    if(!n||n===o)return;
    D.batch[i]=n;save();drawH();msg('已重命名');
  });
}
function renH(key){
  var names={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};
  var el=$('hdr_'+key);
  var cur=el.textContent;
  customPrompt('输入新班次名称：',cur,function(n){
    if(!n||n===cur)return;
    if(!D.colHeaders) D.colHeaders={};
    D.colHeaders[key]=n;
    el.textContent=n;
    save();msg('已重命名');
  });
}

// ===== 选择模式 + 多选删除 =====
var _selMode = false;
var _sel = {};

function toggleSelMode(){
  _selMode = !_selMode;
  document.body.className = _selMode ? 'selmode' : '';
  $('btnSelMode').textContent = _selMode ? '完成' : '删除';
  if(_selMode){
    for(var i=0;i<D.rows.length;i++) _sel[i] = true;
    // 全选所有行checkbox
    var cbs = document.querySelectorAll('#tb .cbtd input');
    for(var i=0;i<cbs.length;i++) cbs[i].checked = true;
    $('selAll').checked = D.rows.length>0;
  } else {
    _sel = {};
    $('selAll').checked = false;
  }
  var n = _selMode ? D.rows.length : 0;
  var b = $('btnDelSel');
  if(n>0){ b.style.display='inline-block'; b.textContent='🗑️ 删选中('+n+')'; }
  else { b.style.display='none'; }
  $('selInfo').textContent = n>0 ? '已选 '+n+' 行' : '';
}

function toggleAll(){
  var c = $('selAll').checked;
  for(var i=0;i<D.rows.length;i++) _sel[i] = c;
  // 更新所有行checkbox
  var tds = document.querySelectorAll('#tb .cbtd input');
  for(var i=0;i<tds.length;i++) tds[i].checked = c;
  updateSelUI();
}

function toggleSel(i){
  _sel[i] = !_sel[i];
  var cbs = document.querySelectorAll('#tb .cbtd input');
  if(cbs[i]) cbs[i].checked = _sel[i];
  updateSelUI();
}

function updateSelUI(){
  var n = 0;
  for(var k in _sel) if(_sel[k]) n++;
  // 全选状态
  var all = D.rows.length>0;
  for(var i=0;i<D.rows.length;i++) if(!_sel[i]){ all=false; break; }
  $('selAll').checked = all;
  // 删除按钮 + 提示
  var b = $('btnDelSel');
  if(n>0){ b.style.display='inline-block'; b.textContent='🗑️ 删选中('+n+')'; }
  else { b.style.display='none'; }
  $('selInfo').textContent = n>0 ? '已选 '+n+' 行' : '';
}

function delSel(){
  var idxs = [];
  for(var k in _sel) if(_sel[k]) idxs.push(parseInt(k));
  if(!idxs.length){ msg('未选择'); return; }
  customConfirm('删除 '+idxs.length+' 行？',function(){
    idxs.sort(function(a,b){return b-a});
    for(var i=0;i<idxs.length;i++) D.rows.splice(idxs[i],1);
    _sel = {};
    save(); render(); msg('已删除 '+idxs.length+' 行');
  });
}

// ===== 渲染 =====
var _firstRender = true;
function render(){
  drawH();
  updateMonths();
  updatePersonFilter();
  var tb = $('tb');
  var filtered = getFilteredRows();
  if(!filtered.length){
    tb.innerHTML='<tr><td colspan="12" style="padding:32px 24px;color:var(--text-muted);font-size:13px">暂无排班数据</td></tr>';
    $('st').textContent='0行';
    return;
  }
  var lookup={}; for(var i=0;i<D.rows.length;i++) lookup[D.rows[i].d]=i;
  var h = '';
  for(var di=0;di<filtered.length;di++){
    var ri = lookup[filtered[di].d];
    var r = D.rows[ri];
    var delay = di*25;
    var checked = _sel[ri] ? ' checked' : '';
    
    // 构建每列
    function tg(n,c){ return '<span class="tg" style="background:'+c+'">'+esc(n)+'</span>'; }
    
    function wCell(k, bg, ci){
      var arr = r[k]||[];
      var txt = arr.length ? arr.map(function(x){return tg(x,bg);}).join('') : '<span style="color:var(--gray-300)">—</span>';
      return '<td class="cl" style="background:'+bg+'" onclick="pkW('+ri+','+ci+')" title="左键编辑">'+txt+'</td>';
    }
    function pCell(k, bg){
      var arr = r[k]||[];
      var txt = arr.length ? arr.map(function(x){
        var c = x.f ? 'var(--red)' : bg;
        return tg(x.n, c);
      }).join('') : '<span style="color:var(--gray-300)">—</span>';
      return '<td class="cl" style="background:'+bg+'" onclick="pkP('+ri+',\''+k+'\')" title="左键编辑">'+txt+'</td>';
    }
    
    var animStyle = _firstRender ? 'animation:rowIn 250ms var(--ease-out) both;animation-delay:'+(di*25)+'ms;' : '';
    h += '<tr style="'+animStyle+'" oncontextmenu="delRow('+ri+');return false">';

    h += wCell('w0','#dcfce7',0)+wCell('w1','#dbeafe',1)+wCell('w2','#fef9c3',2);
    h += pCell('e','#dbeafe')+pCell('mb','#93c5fd')+pCell('mp','#a78bfa');
    h += pCell('s1','#fef9c3')+pCell('s2','#fde68a')+pCell('bn','#fce7f3')+pCell('of','#f1f5f9');
    h += '</tr>';
  }
  tb.innerHTML = h;
  $('st').textContent = filtered.length+'行 (全部'+D.rows.length+'行)';
  updateSelUI();
  _firstRender = false;
}

// ===== 范围 =====
function updateRangeInfo(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(!d1 || !d2){ $('rangeInfo').textContent=''; return; }
  if(d1 > d2){ $('rangeInfo').textContent='开始>结束'; return; }
  var diff = (new Date(d2) - new Date(d1)) / 86400000 + 1;
  $('rangeInfo').textContent = diff>1 ? '共 '+diff+' 天' : '';
}
function addBatchRows(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(!d1 || !d2){ msg('选日期'); return; }
  if(d1 > d2){ msg('开始日期大于结束日期'); return; }
  var added = 0;
  var cur = new Date(d1);
  var end = new Date(d2);
  while(cur <= end){
    var ds = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    var d = sl(ds);
    var exists = false;
    for(var i=0;i<D.rows.length;i++){ if(D.rows[i].d===d){ exists=true; break; } }
    if(!exists){
      D.rows.push({d:d,w0:[],w1:[],w2:[],e:[],mb:[],mp:[],s1:[],s2:[],bn:[],of:[]});
      added++;
    }
    cur.setDate(cur.getDate()+1);
  }
  if(!added){ msg('全部已存在'); return; }
  D.rows.sort(function(a,b){ return a.d>b.d?1:(a.d<b.d?-1:0); });
  save(); render(); msg('添加 '+added+' 天');
}

// ===== 添加/删除单行 =====
function addRow(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(d2 && d1 !== d2){ addBatchRows(); return; }
  var d = $('d').value;
  if(!d){ msg('选日期'); return; }
  d = sl(d);
  for(var i=0;i<D.rows.length;i++){ if(D.rows[i].d===d){ msg('已存在'); return; } }
  D.rows.push({d:d,w0:[],w1:[],w2:[],e:[],mb:[],mp:[],s1:[],s2:[],bn:[],of:[]});
  D.rows.sort(function(a,b){ return a.d>b.d?1:(a.d<b.d?-1:0); });
  save(); render(); msg('已添加');
}

function pkP(ri, key){
  _ctx = {ri:ri, key:key, mode:'person'};
  var r = D.rows[ri];
  var cur = r[key]||[];
  var ns = {};
  var keys=['e','mb','mp','s1','s2','bn','of'];
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};
  for(var k=0;k<keys.length;k++) ns[keys[k]] = (D.colHeaders&&D.colHeaders[keys[k]]) || defs[keys[k]];
  var icons={e:'☀️',mb:'🍱',mp:'⏰',s1:'🌆',s2:'🌃',bn:'🌙',of:'😴'};
  $('mxt').innerHTML = '<span class="mh-icon">'+(icons[key]||'👤')+'</span>'+r.d+' — '+ns[key];
  $('mxh').textContent = '点击选人·灰色+虚线=已排别班·双击强制(红色)';
  gridP(cur, key, ri);
  $('mxn').placeholder = '新姓名';
  $('mx').className = 'm s';
  updateFooterBt();
}
function gridP(cur, key, ri){
  var r = D.rows[ri]; if(!r) return;
  var allKeys = ['e','mb','mp','s1','s2','bn','of'];
  var h = '';
  for(var i=0;i<D.people.length;i++){
    var n = D.people[i];
    var inCur = cur.some(function(x){ return x.n===n; });
    var inOther = false;
    for(var j=0;j<allKeys.length;j++){
      if(allKeys[j]===key) continue;
      // 蓝/紫 与 早班 不互斥
      if((key==='mb'||key==='mp') && allKeys[j]==='e') continue;
      if(key==='e' && (allKeys[j]==='mb'||allKeys[j]==='mp')) continue;
      if(r[allKeys[j]] && r[allKeys[j]].some(function(x){ return x.n===n; })){ inOther=true; break; }
    }
    var cls = '';
    if(inCur) cls = ' s';
    else if(inOther) cls = ' fd';
    var onclick = inOther ? "pkPForce('"+esc(n)+"')" : "pkPClick('"+esc(n)+"')";
    h += '<div class="'+cls+'" onclick="'+onclick+'">'+esc(n)+'<span class="chip-x" onclick="event.cancelBubble=true;mdDelPerson(\''+esc(n)+'\')">✕</span></div>';
  }
  $('mxg').innerHTML = h;
}
function pkPClick(n){
  var r = D.rows[_ctx.ri]; if(!r) return;
  var cur = r[_ctx.key]||[];
  var idx = cur.findIndex(function(x){ return x.n===n; });
  if(idx>=0) cur.splice(idx,1); else cur.push({n:n,f:0});
  gridP(cur, _ctx.key, _ctx.ri);
}
function pkPForce(n){
  var r = D.rows[_ctx.ri]; if(!r) return;
  var cur = r[_ctx.key]||[];
  var idx = cur.findIndex(function(x){ return x.n===n; });
  if(idx>=0){ cur.splice(idx,1); }else{ cur.push({n:n,f:1}); msg('强制排班 '+n); }
  gridP(cur, _ctx.key, _ctx.ri);
}
function mdDelPerson(n){
  var i = D.people.indexOf(n); if(i<0) return;
  customConfirm('删除人员 "'+n+'"？',function(){
    D.people.splice(i,1); save();
    if(_ctx&&_ctx.ri!=null){
      var r=D.rows[_ctx.ri];
      if(r) gridP(r[_ctx.key]||[], _ctx.key, _ctx.ri);
    }
  });
}

// ===== 统计 =====
function buildStats(){
  var stats={};
  D.people.forEach(function(n){ stats[n]={morning:0,evening:0,night:0,off:0}; });
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};
  // 按人按天去重：同一个人在同一天同一个班次类别只计一次
  // mb(中午值班)/mp(延迟吃饭)是早班的附加职责，不单独计班次
  for(var i=0;i<D.rows.length;i++){
    var r=D.rows[i]; if(!r) continue;
    D.people.forEach(function(nm){
      var m=(r.e||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.mb||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.mp||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var e=(r.s1||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.s2||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var n=(r.bn||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var f=(r.of||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      if(stats[nm]){
        if(m) stats[nm].morning++;
        if(e) stats[nm].evening++;
        if(n) stats[nm].night++;
        if(f) stats[nm].off++;
      }
    });
  }
  return stats;
}
function showStats(){
  var stats=buildStats();
  var names=Object.keys(stats).filter(function(n){return D.people.indexOf(n)>=0;}).sort();
  var h='<table style="font-size:13px;width:100%;border-collapse:collapse">';

// ===== 导出（ExcelJS纯前端） =====
function exp(){
  if(!D.rows.length){ msg('无数据'); return; }

  var shiftKeys=['e','mb','mp','s1','s2','bn','of'];
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};

  function grp(k){
    var n=(D.colHeaders&&D.colHeaders[k])||defs[k]||k;
    if(n.indexOf('早')>=0||k==='e'||k==='mb'||k==='mp') return 'morning';
    if(n.indexOf('小夜')>=0||k==='s1'||k==='s2') return 'evening';
    if(n.indexOf('大夜')>=0||k==='bn') return 'night';
    if(n.indexOf('休')>=0||k==='of') return 'off';
    return 'morning';
  }
  function buildRow(r){
    var b1=(r.w0||[]).join('\n'), b2=(r.w1||[]).join('\n'), b3=(r.w2||[]).join('\n');
    // 用Set去重：mb/mp与早班在同一组，避免同一人重复出现
    var gs={morning:new Set(),evening:new Set(),night:new Set(),off:new Set()};
    shiftKeys.forEach(function(k){
      (r[k]||[]).forEach(function(p){
        var nm=(typeof p==='object')?p.n+(p.f?'(强)':''):String(p);
        var g=grp(k);
        if(g && gs[g]) gs[g].add(nm);
      });
    });
    return [r.d,b1,b2,b3,[...gs.morning].join('、'),[...gs.evening].join('、'),[...gs.night].join('、'),[...gs.off].join('、')];
  }

  var bN=[D.batch[0]||'批号1',D.batch[1]||'批号2',D.batch[2]||'批号3'];
  var mRows={};
  D.rows.forEach(function(r){
    var mk=r.d.substring(0,7);
    if(!mRows[mk]) mRows[mk]=[];
    mRows[mk].push(buildRow(r));
  });
  var months=Object.keys(mRows).sort();

  var wb=new ExcelJS.Workbook();
  wb.creator='57车间';

  var hdrFill={type:'pattern',pattern:'solid',fgColor:{argb:'FF007AFF'}};
  var hdrFont={name:'Microsoft YaHei',bold:true,size:11,color:{argb:'FFFFFFFF'}};
  var titleFont={name:'Microsoft YaHei',bold:true,size:14};
  var noteFont={name:'Microsoft YaHei',size:9,italic:true,color:{argb:'FF8E8E93'}};
  var dataFont={name:'Microsoft YaHei',size:10};
  var boldFont={name:'Microsoft YaHei',bold:true,size:10};
  var batchFills=[{type:'pattern',pattern:'solid',fgColor:{argb:'FFD5F5E3'}},{type:'pattern',pattern:'solid',fgColor:{argb:'FFD6E4F0'}},{type:'pattern',pattern:'solid',fgColor:{argb:'FFFEF9C3'}}];
  var thin={style:'thin',color:{argb:'FF000000'}};
  var borderAll={top:thin,left:thin,bottom:thin,right:thin};
  var center={horizontal:'center',vertical:'center',wrapText:true};
  var leftWrap={horizontal:'left',vertical:'center',wrapText:true};

  months.forEach(function(mk){
    var rows=mRows[mk];
    var dateRange=rows[0][0]+' ~ '+rows[rows.length-1][0];
    var ws=wb.addWorksheet(mk.replace('/','-'));
    [16,36,36,36,30,30,30,16].forEach(function(w,i){ ws.getColumn(i+1).width=w; });

    ws.mergeCells(1,1,1,8);
    var c1=ws.getCell('A1');
    c1.value='57车间排班表 ('+mk+')'; c1.font=titleFont; c1.alignment=center;
    ws.getRow(1).height=38;

    ws.mergeCells(2,1,2,8);
    var c2=ws.getCell('A2');
    c2.value='周期: '+dateRange; c2.font=noteFont;
    c2.alignment={horizontal:'left',vertical:'center'};
    ws.getRow(2).height=22;

    var hdrs=['日期',bN[0],bN[1],bN[2],'早班人员','小夜班人员','大夜班人员','休班人员'];
    var hr=ws.getRow(3); hr.height=30;
    hdrs.forEach(function(h,i){
      var cell=hr.getCell(i+1);
      cell.value=h; cell.font=hdrFont; cell.fill=hdrFill;
      cell.alignment=center; cell.border=borderAll;
    });

    rows.forEach(function(vals,idx){
      var rn=4+idx;
      var row=ws.getRow(rn);
      // 计算自适应行高
      var maxLines=1;
      vals.forEach(function(v,ci){
        if(ci===0) return; // 日期列
        var lines=(String(v).match(/\n/g)||[]).length+1;
        // 对人员列(索引4-7)也用、估算换行
        if(ci>=4 && v.indexOf('、')>=0){
          var est=Math.ceil(String(v).length/15);
          if(est>lines) lines=est;
        }
        if(lines>maxLines) maxLines=lines;
      });
      row.height=Math.max(72, maxLines*18);

      vals.forEach(function(v,i){
        var cell=row.getCell(i+1);
        cell.value=v; cell.font=dataFont; cell.border=borderAll;
        cell.alignment=i===0?center:leftWrap;
        if(i>=1&&i<=3) cell.fill=batchFills[i-1];
      });
    });

    var sr=4+rows.length;
    ws.mergeCells(sr,1,sr,4);
    var sc=ws.getCell(sr,1);
    sc.value='合计'; sc.font=boldFont; sc.alignment=center; sc.border=borderAll;
    for(var i=2;i<=8;i++){ ws.getCell(sr,i).border=borderAll; }
    var sc5=ws.getCell(sr,5);
    sc5.value=mk+' -- '+rows.length+' 个工作日';
    sc5.font=dataFont; sc5.alignment=leftWrap; sc5.border=borderAll;
    ws.getRow(sr).height=25;

    ws.pageSetup.orientation='landscape';
    ws.pageSetup.fitToPage=true;
    ws.pageSetup.fitToWidth=1; ws.pageSetup.fitToHeight=0;
  });

  var stats=buildStats();
  var names=Object.keys(stats).filter(function(n){return D.people.indexOf(n)>=0;}).sort();
  var wsS=wb.addWorksheet('出勤统计');
  [12,8,8,8,8,8].forEach(function(w,i){ wsS.getColumn(i+1).width=w; });

  wsS.mergeCells(1,1,1,6);
  var st=wsS.getCell('A1');
  st.value='出勤统计'; st.font=titleFont; st.alignment=center;
  wsS.getRow(1).height=38;

  var sHdrs=['姓名','早班','小夜班','大夜班','休班','合计'];
  var sr2=wsS.getRow(2); sr2.height=26;
  sHdrs.forEach(function(h,i){
    var cell=sr2.getCell(i+1);
    cell.value=h; cell.font=hdrFont; cell.fill=hdrFill;
    cell.alignment=center; cell.border=borderAll;
  });

  names.forEach(function(n,idx){
    var rn=3+idx;
    var row=wsS.getRow(rn); row.height=22;
    var s=stats[n];
    var vals=[n,s.morning||0,s.evening||0,s.night||0,s.off||0,s.morning+s.evening+s.night+s.off];
    vals.forEach(function(v,i){
      var cell=row.getCell(i+1);
      cell.value=v; cell.font=dataFont; cell.border=borderAll; cell.alignment=center;
    });
  });

  wb.xlsx.writeBuffer().then(function(buf){
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=window.URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='57车间排班表.xlsx';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    msg('导出成功');
  }).catch(function(e){ msg('导出失败'); console.error(e); });
}

// ===== 导出 PDF（浏览器打印转PDF） =====
function expPDF(){
  if(!D.rows.length){ msg('无数据'); return; }
  msg('正在打开打印对话框，选择"另存为PDF"...');
  setTimeout(function(){ window.print(); }, 300);
}

// ===== 复制/粘贴功能 =====
var _clip = null;

function copyCell(){
  if(!_ctx) return;
  var r = D.rows[_ctx.ri]; if(!r) return;
  _clip = { type: _ctx.mode, key: _ctx.key, data: JSON.parse(JSON.stringify(r[_ctx.key]||[])) };
  msg('✅ 已复制'+(_clip.data.length||'空'));
  updateFooterBt();
}

function pasteCell(){
  if(!_clip||!_ctx){ msg('无内容可粘贴'); return; }
  if(_clip.key!==_ctx.key){ msg('类型不符，请复制同类型单元格'); return; }
  var r = D.rows[_ctx.ri]; if(!r) return;
  r[_ctx.key] = JSON.parse(JSON.stringify(_clip.data));
  save();
  if(_ctx.mode==='work') gridW(r[_ctx.key]||[]);
  else gridP(r[_ctx.key]||[], _ctx.key, _ctx.ri);
  msg('✅ 已粘贴');
}

function pasteToRange(){
  if(!_clip||!_ctx){ msg('无内容可粘贴'); return; }
  if(_clip.key!==_ctx.key){ msg('类型不符，请复制同类型单元格'); return; }
  customPrompt('粘贴到后续几天（含今天）？','3',function(days){
    if(!days) return;
    var n = parseInt(days);
    if(isNaN(n)||n<1){ msg('无效数字'); return; }
    var curIdx = -1;
    for(var i=0;i<D.rows.length;i++){ if(D.rows[i]&&D.rows[i].d===D.rows[_ctx.ri].d){ curIdx=i; break; } }
    if(curIdx<0) return;
    var pasted = 0;
    for(var i=curIdx;i<curIdx+n&&i<D.rows.length;i++){
      if(D.rows[i]){ D.rows[i][_clip.key]=JSON.parse(JSON.stringify(_clip.data)); pasted++; }
    }
    save(); render(); mdClose();
    msg('✅ 已粘贴到 '+pasted+' 天');
  });
}

function rClickW(ri,ci){
  var r = D.rows[ri]; if(!r) return false;
  var key = 'w'+ci;
  if(_clip && _clip.key===key){
    r[key] = JSON.parse(JSON.stringify(_clip.data));
    save(); render();
    msg('✅ 已粘贴工作内容');
  } else {
    _clip = { type:'work', key:key, data: JSON.parse(JSON.stringify(r[key]||[])) };
    msg('✅ 已复制工作内容 ('+(_clip.data.length||'空')+')');
  }
  return false;
}

function rClickP(ri,key){
  var r = D.rows[ri]; if(!r) return false;
  if(_clip && _clip.key===key){
    r[key] = JSON.parse(JSON.stringify(_clip.data));
    save(); render();
    msg('✅ 已粘贴班次');
  } else {
    _clip = { type:'person', key:key, data: JSON.parse(JSON.stringify(r[key]||[])) };
    msg('✅ 已复制班次 ('+(_clip.data.length||'空')+')');
  }
  return false;
}

function updateFooterBt(){
  var bt = $('mx').querySelector('.bt');
  if(!bt) return;
  if(!_ctx||_ctx.mode2){
    bt.innerHTML='<button class="btn btn-o" onclick="mdCancel()">取消</button><button class="btn btn-p" onclick="mdOk()">确定</button>';
    return;
  }
  var canPaste = _clip && _clip.key === _ctx.key;
  var h = '';
  h += '<button class="btn btn-o btn-sm" onclick="copyCell()" title="复制当前安排">📋 复制</button>';
  if(canPaste){
    h += '<button class="btn btn-o btn-sm" onclick="pasteCell()" title="粘贴到当天">📝 粘贴</button>';
    h += '<button class="btn btn-o btn-sm" onclick="pasteToRange()" title="粘贴到连续多天">📝 粘后续</button>';
  }
  if(_clip){
    var clipInfo = _clip.data.length + '项';
    h += '<span style="font-size:11px;color:var(--text-muted);margin:0 4px">📋已复制('+clipInfo+')</span>';
  }
  h += '<span style="flex:1"></span>';
  h += '<button class="btn btn-o" onclick="mdCancel()">取消</button>';
  h += '<button class="btn btn-p" onclick="mdOk()">确定</button>';
  bt.innerHTML = h;
}

$('d').value = today();
render();
</script>

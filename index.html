<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>新时代药业 · 57车间排班表</title>
<style>
/* ============================================================
   新时代药业57车间排班表 · 制药精工 设计系统
   Pharma Precision — Clean. Professional. Life-science.
   ============================================================ */

/* ===== DESIGN TOKENS: Light Theme ===== */
:root {
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease-bounce: cubic-bezier(0.68,-0.55,0.27,1.55);

  /* Primary — Deep Cyan-Teal */
  --accent:        #0d7b8a;
  --accent-hover:  #0a6470;
  --accent-light:  #e6f4f6;
  --accent-ring:   rgba(13,123,138,.2);

  /* Accent — Warm Amber */
  --amber:         #e0893a;
  --amber-hover:   #c4742b;
  --amber-light:   #fef6ee;

  /* Semantic */
  --green:         #2d8a56;
  --green-hover:   #236e44;
  --green-light:   #eaf7f0;
  --red:           #c44536;
  --red-hover:     #a33629;
  --red-light:     #fef5f3;

  /* Neutrals — subtly warm */
  --gray-50:  #f8f6f2;
  --gray-100: #f0ede7;
  --gray-200: #e4e0d8;
  --gray-300: #d0cbc2;
  --gray-400: #a8a39a;
  --gray-500: #7d7870;
  --gray-600: #5a554e;
  --gray-700: #3b3731;
  --gray-800: #24211c;
  --gray-900: #141210;

  /* Surface */
  --bg:            #f3f0ea;
  --surface:       #ffffff;
  --surface-hover: #faf9f5;
  --text:          var(--gray-800);
  --text-muted:    var(--gray-500);

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(20,18,16,.04);
  --shadow-sm: 0 2px 8px rgba(20,18,16,.06);
  --shadow-md: 0 6px 20px rgba(20,18,16,.08);
  --shadow-lg: 0 16px 48px rgba(20,18,16,.12);

  /* Glass */
  --glass:         rgba(255,255,255,.78);
  --glass-strong:  rgba(255,255,255,.94);
  --glass-border:  rgba(20,18,16,.08);

  /* Typography */
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","HarmonyOS Sans",sans-serif;
  --font-mono: "SF Mono","Cascadia Code","Consolas",monospace;

  /* Spacing (4px grid) */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;

  /* Radius */
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;--r-full:9999px;
}

/* ===== DESIGN TOKENS: Dark Theme ===== */
[data-theme="dark"] {
  --accent:        #3db8cc;
  --accent-hover:  #55c9db;
  --accent-light:  #0f262c;
  --accent-ring:   rgba(61,184,204,.25);
  --amber:         #e89a4f;
  --amber-hover:   #f0b06e;
  --amber-light:   #261d12;
  --green:         #4dbe72;
  --green-hover:   #68d489;
  --green-light:   #121f17;
  --red:           #e06050;
  --red-hover:     #ed7d70;
  --red-light:     #261513;

  --gray-50:  #19191c;
  --gray-100: #212226;
  --gray-200: #2d2e33;
  --gray-300: #3c3d43;
  --gray-400: #696a71;
  --gray-500: #8c8d94;
  --gray-600: #aeaeb5;
  --gray-700: #cccbd1;
  --gray-800: #e2e1e6;
  --gray-900: #f5f4f7;

  --bg:            #111113;
  --surface:       #1b1c20;
  --surface-hover: #232429;
  --text:          var(--gray-800);
  --text-muted:    var(--gray-500);

  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --shadow-md: 0 6px 20px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);

  --glass:         rgba(28,29,34,.82);
  --glass-strong:  rgba(35,37,43,.95);
  --glass-border:  rgba(255,255,255,.07);
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; }
}

/* ===== PRINT ===== */
@media print {
  body{background:#fff!important;padding:8px;color:#000;}
  .bar-wrap,.info,.m,.msg,.bar,.btn-o,.btn-sm,.btn-p,.btn-g{display:none!important;}
  .wrap{box-shadow:none;border:1px solid #ccc;max-width:100%;overflow:visible;max-height:none;border-radius:0}
  .wrap::before{display:none!important}
  /* fit table to page width so right columns are not clipped */
  table{font-size:9px;table-layout:fixed;width:100%!important}
  th,td{border:1px solid #999;color:#000!important;padding:4px 5px;background:#fff!important;white-space:normal;word-break:break-word}
  th{white-space:normal}
  h1{color:#000;font-size:20px}
}

/* ===== KEYFRAMES ===== */
@keyframes fadeSlideUp {
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes scaleIn {
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}
@keyframes pulseDot {
  0%,100%{opacity:1}
  50%{opacity:.35}
}
@keyframes rowIn {
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes shimmer {
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}

/* ===== GLOBAL RESET ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{font-size:16px;scroll-behavior:smooth}

body{
  font-family:var(--font);
  background:transparent;
  color:var(--text);
  padding:var(--sp-10) var(--sp-4) var(--sp-8);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.6;
  min-height:100vh;
  position:relative;
}

/* Layer 1: Base color + pharmaceutical glow */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 8% 5%, rgba(13,123,138,.24) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 90% 80%, rgba(45,138,86,.18) 0%, transparent 50%),
    radial-gradient(ellipse 55% 45% at 50% 110%, rgba(224,137,58,.12) 0%, transparent 45%),
    radial-gradient(ellipse 40% 35% at 80% 10%, rgba(13,123,138,.08) 0%, transparent 40%),
    var(--bg);
  pointer-events:none;z-index:-3;
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(ellipse 70% 55% at 8% 5%, rgba(61,184,204,.18) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 90% 80%, rgba(77,190,114,.12) 0%, transparent 50%),
    radial-gradient(ellipse 55% 45% at 50% 110%, rgba(232,154,79,.08) 0%, transparent 45%),
    radial-gradient(ellipse 40% 35% at 80% 10%, rgba(61,184,204,.06) 0%, transparent 40%),
    var(--bg);
}

/* Top brand bar */
.brand-bar{
  position:fixed;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-hover) 25%,var(--green) 50%,var(--amber) 75%,var(--accent) 100%);
  background-size:200% 100%;
  z-index:9999;
  animation:brandShimmer 6s linear infinite;
}
@keyframes brandShimmer{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}

/* Layer 2: Large "57" watermark */
.workshop-watermark{
  position:fixed;
  right:2vw;
  bottom:1vh;
  font-size:24vw;
  font-weight:900;
  font-family:var(--font);
  color:rgba(13,123,138,.07);
  line-height:.8;
  letter-spacing:-0.08em;
  pointer-events:none;
  z-index:-2;
  user-select:none;
  text-shadow:0 0 80px rgba(13,123,138,.04);
}
.workshop-watermark.left{
  right:auto;
  left:2vw;
  top:5vh;
  bottom:auto;
  font-size:14vw;
  color:rgba(45,138,86,.05);
  transform:rotate(-12deg);
}
[data-theme="dark"] .workshop-watermark{
  color:rgba(61,184,204,.08);
}
[data-theme="dark"] .workshop-watermark.left{
  color:rgba(77,190,114,.06);
}

  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360'><g opacity='0.22'><polygon fill='none' stroke='%230d7b8a' stroke-width='1.3' points='30,25 52,12 74,25 74,51 52,64 30,51'/><circle cx='30' cy='25' r='3' fill='%230d7b8a'/><circle cx='52' cy='12' r='3' fill='%230d7b8a'/><circle cx='74' cy='25' r='3' fill='%230d7b8a'/><circle cx='74' cy='51' r='3' fill='%230d7b8a'/><circle cx='52' cy='64' r='3' fill='%230d7b8a'/><circle cx='30' cy='51' r='3' fill='%230d7b8a'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='74' y1='51' x2='110' y2='75'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='52' y1='64' x2='90' y2='115'/><text x='92' y='90' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%230d7b8a' opacity='0.4'>57</text><polygon fill='none' stroke='%230d7b8a' stroke-width='1.3' points='250,200 272,187 294,200 294,226 272,239 250,226'/><circle cx='250' cy='200' r='3' fill='%230d7b8a'/><circle cx='272' cy='187' r='3' fill='%230d7b8a'/><circle cx='294' cy='200' r='3' fill='%230d7b8a'/><circle cx='294' cy='226' r='3' fill='%230d7b8a'/><circle cx='272' cy='239' r='3' fill='%230d7b8a'/><circle cx='250' cy='226' r='3' fill='%230d7b8a'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='220' y1='200' x2='250' y2='200'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='294' y1='226' x2='310' y2='260'/><rect fill='none' stroke='%232d8a56' stroke-width='1.2' x='15' y='130' width='48' height='18' rx='9'/><rect x='15' y='130' width='24' height='18' rx='9' fill='%232d8a56' opacity='0.3'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='39' y1='130' x2='39' y2='148'/><rect fill='none' stroke='%23e0893a' stroke-width='1.2' x='280' y='40' width='52' height='18' rx='9' transform='rotate(25 306 49)'/><rect x='280' y='40' width='26' height='18' rx='9' fill='%23e0893a' opacity='0.3' transform='rotate(25 306 49)'/><line x1='306' y1='40' x2='306' y2='58' stroke='%23e0893a' stroke-width='1.2' transform='rotate(25 306 49)'/><line x1='280' y1='175' x2='300' y2='175' stroke='%230d7b8a' stroke-width='3.5'/><line x1='290' y1='165' x2='290' y2='185' stroke='%230d7b8a' stroke-width='3.5'/><line x1='130' y1='290' x2='150' y2='290' stroke='%232d8a56' stroke-width='3.5'/><line x1='140' y1='280' x2='140' y2='300' stroke='%232d8a56' stroke-width='3.5'/><path fill='none' stroke='%230d7b8a' stroke-width='1.3' d='M115,200 Q122,185 129,200 T143,200 T157,200 T171,200 T185,200'/><path fill='none' stroke='%230d7b8a' stroke-width='1.3' d='M115,210 Q122,225 129,210 T143,210 T157,210 T171,210 T185,210'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='122' y1='195' x2='122' y2='215'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='136' y1='195' x2='136' y2='215'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='150' y1='195' x2='150' y2='215'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='164' y1='195' x2='164' y2='215'/><line fill='none' stroke='%230d7b8a' stroke-width='1.3' x1='178' y1='195' x2='178' y2='215'/><path fill='none' stroke='%23e0893a' stroke-width='1.2' d='M200,280 L200,310 Q200,318 208,318 L232,318 Q240,318 240,310 L240,280 Z'/><line fill='none' stroke='%23e0893a' stroke-width='1.2' x1='195' y1='280' x2='245' y2='280'/><line fill='none' stroke='%23e0893a' stroke-width='1.2' x1='220' y1='280' x2='220' y2='318'/><circle cx='210' cy='305' r='2' fill='%23e0893a' opacity='0.4'/><circle cx='225' cy='300' r='1.5' fill='%23e0893a' opacity='0.3'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='155' y1='120' x2='165' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='160' y1='120' x2='170' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='165' y1='120' x2='175' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='170' y1='120' x2='180' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='175' y1='120' x2='185' y2='115'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='165' y1='120' x2='165' y2='135'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='175' y1='120' x2='175' y2='135'/><line fill='none' stroke='%232d8a56' stroke-width='1.2' x1='155' y1='135' x2='185' y2='135'/></g></svg>");
  background-size:360px 360px;
  pointer-events:none;z-index:-1;
}
[data-theme="dark"] body::after{
  opacity:.6;
}

/* ===== CUSTOM SCROLLBAR ===== */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--gray-300)}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

/* ===== HEADER ===== */
h1{
  font-size:2rem;
  font-weight:800;
  letter-spacing:-.03em;
  margin:0 0 var(--sp-2);
  color:var(--gray-900);
  line-height:1.1;
  text-align:center;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-hover) 50%,var(--amber) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
[data-theme="dark"] h1{
  background:linear-gradient(135deg,var(--accent) 0%,#7dd3e8 50%,var(--amber) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.info{
  font-size:.8125rem;
  color:var(--text-muted);
  margin:0 0 var(--sp-6);
  line-height:1.7;
  text-align:center;
  letter-spacing:.01em;
  max-width:500px;
  margin-left:auto;margin-right:auto;
}

/* ===== TOOLBAR ===== */
.bar-wrap{
  background:var(--surface);
  border-radius:var(--r-lg);
  padding:var(--sp-4);
  margin-bottom:var(--sp-4);
  box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-100);
}

.bar{
  display:flex;
  gap:var(--sp-2);
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}

.bar label{
  font-weight:600;
  font-size:.75rem;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  user-select:none;
}

/* ===== FORM INPUTS ===== */
.inp{
  height:36px;
  padding:0 12px;
  border:1.5px solid var(--gray-200);
  border-radius:var(--r-md);
  font-size:.8125rem;
  font-family:var(--font);
  background:var(--gray-50);
  color:var(--text);
  transition:all 180ms var(--ease-out);
  outline:none;
}
.inp:hover{border-color:var(--gray-300);background:var(--surface)}
.inp:focus{
  border-color:var(--accent);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-ring);
}

/* Custom select arrow */
select.inp{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237d7870' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:28px;cursor:pointer;
}
[data-theme="dark"] select.inp{
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238c8d94' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:36px;padding:0 16px;border:none;
  border-radius:var(--r-md);
  font-size:.8125rem;font-weight:600;font-family:var(--font);
  cursor:pointer;user-select:none;white-space:nowrap;
  letter-spacing:.01em;outline:none;
  transition:all 160ms var(--ease-out);
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:scale(.95)}

/* Primary */
.btn-p{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
}
.btn-p:hover{
  background:var(--accent-hover);
  box-shadow:0 4px 12px rgba(13,123,138,.3);
  transform:translateY(-1px);
}
.btn-p:active{transform:scale(.95) translateY(0)}

/* Success / Export */
.btn-g{
  background:var(--green);color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
}
.btn-g:hover{
  background:var(--green-hover);
  box-shadow:0 4px 12px rgba(45,138,86,.3);
  transform:translateY(-1px);
}
.btn-g:active{transform:scale(.95) translateY(0)}

/* Outline */
.btn-o{
  background:var(--surface);border:1.5px solid var(--gray-200);color:var(--gray-600);
}
.btn-o:hover{
  background:var(--gray-50);border-color:var(--gray-300);color:var(--gray-700);
}

/* Small */
.btn-sm{height:30px;padding:0 10px;font-size:.75rem}

/* ===== CHECKBOXES ===== */
input[type=checkbox]{
  width:17px;height:17px;
  accent-color:var(--accent);cursor:pointer;
  border-radius:4px;
}

/* ===== STATUS TEXT ===== */
#st,#rangeInfo,#selInfo{font-size:.75rem;color:var(--text-muted)}

/* ===== TABLE CONTAINER ===== */
.wrap{
  background:var(--bg);
  border-radius:var(--r-lg);
  overflow:auto;
  margin:0 auto var(--sp-4);
  max-width:1200px;width:100%;
  box-shadow:var(--shadow-md);
  max-height:calc(100vh - 220px);
  border:1px solid var(--gray-100);
  position:relative;
}

/* Subtle inner border glow on the container */
.wrap::before{
  content:'';
  position:absolute;inset:0;
  border-radius:var(--r-lg);
  border:1px solid rgba(13,123,138,.06);
  pointer-events:none;z-index:1;
}

/* ===== TABLE ===== */
table{
  width:100%;border-collapse:collapse;
  font-size:.875rem;font-family:var(--font);
  font-variant-numeric:tabular-nums;
}

th,td{
  padding:10px 10px;text-align:center;vertical-align:middle;
  border-bottom:1px solid var(--gray-100);
}

/* Header cells */
th{
  white-space:nowrap;
  font-size:.75rem;font-weight:700;
  color:var(--gray-600);
  text-transform:uppercase;letter-spacing:.04em;
  background:var(--bg);
  position:sticky;top:0;z-index:20;
  border-top:none;
}

/* Data cells */
td{
  white-space:normal;word-break:break-word;max-width:160px;
  transition:background 100ms var(--ease-out);
}

/* First column (date) */
td:first-child{
  white-space:nowrap;max-width:none;
  font-weight:700;color:var(--gray-700);
  font-variant-numeric:tabular-nums;
}

tr:last-child td{border-bottom:none}

/* Row hover */
@media(hover:hover){
  tbody tr:hover td{background:var(--surface-hover)!important}
}

/* Alternating row subtle striping */
tbody tr:nth-child(even) td{background:transparent}
[data-theme="dark"] tbody tr:nth-child(even) td{background:transparent}

/* ===== SELECT MODE ===== */
.cbtd,.cbth{display:none}

body.selmode .cbth{
  display:table-cell;position:sticky;left:0;z-index:11;
  background:var(--bg);width:36px;min-width:36px;
}
body.selmode .cbtd{
  display:table-cell;position:sticky;left:0;z-index:6;
  background:var(--bg);width:36px;min-width:36px;
}
body.selmode td:nth-child(2){
  position:sticky;left:36px;z-index:5;
  background:var(--bg);min-width:105px;white-space:nowrap;
}

<script>
'use strict';

var D = {people:[], batch:[], work:[], rows:[]};

// ===== 云端存储 (jsonblob.com) =====
var CLOUD_URL = 'https://jsonblob.com/api/jsonBlob/';
var CLOUD_BLOB_ID = '019f8f85-33d8-7724-b8c7-6a0fa4ff566e';

function getBlobId() {
  return localStorage.getItem('s57blob') || CLOUD_BLOB_ID;
}

function cloudSave() {
  var blobId = getBlobId();
  fetch(CLOUD_URL + blobId, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({data: D, ts: Date.now()})
  }).then(function(r) {
    if (r.status === 404 || r.status === 410) {
      // Blob过期，创建新的
      return fetch(CLOUD_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({data: D, ts: Date.now()})
      }).then(function(r2) {
        var loc = r2.headers.get('Location');
        if (loc) {
          var newId = loc.split('/').pop();
          localStorage.setItem('s57blob', newId);
        }
      });
    }
  }).catch(function(){});
}

function cloudLoad(cb) {
  var blobId = getBlobId();
  fetch(CLOUD_URL + blobId).then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    if (data && data.data && data.data.people) {
      cb(data.data, data.ts || 0);
    }
  }).catch(function(){});
}

function initD() {
  try { var r = localStorage.getItem('s57v2'); if (r) { var d = JSON.parse(r); if (d && d.people) { D = d; if(!D.colHeaders) D.colHeaders={}; return; } } } catch(e){}
  D = {
    people: ['王征征','林新燕','王晓龙','李振','王学灵','崔国干','常远','孙文斌','朱庆强','张峰','毛志琛'],
    batch: ['LNF2529','利妥昔','LNF2501'],
    colHeaders: {e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'},
    leaders: ['李振','王晓龙'],
    work: ['复苏','2500L培养','500L培养','100L培养','WAVE培养','配离心缓冲液','下罐离心','补料A/B配液','纯化','碟片离心','深层过滤','清场记录','收获'],
    rows: []
  };
}
initD();

// ===== 撤销/重做 =====
var _hist = [], _histIdx = -1;
function pushHist(){
  try{
    var cur = JSON.stringify(D);
    if(_histIdx >= 0 && _hist[_histIdx] === cur) return;
    _hist = _hist.slice(0, _histIdx + 1);
    _hist.push(cur);
    if(_hist.length > 50) _hist.shift();
    _histIdx = _hist.length - 1;
  }catch(e){}
}
function histInit(){
  try{ _hist = [JSON.stringify(D)]; _histIdx = 0; }catch(e){}
}
function histRestore(s){
  try{ D = JSON.parse(s); }catch(e){ return; }
  if(!D.colHeaders) D.colHeaders = {};
  try{ localStorage.setItem('s57v2', JSON.stringify(D)); localStorage.setItem('s57ts', String(Date.now())); }catch(e){}
  cloudSave();
  render();
}
function undo(){
  if(_histIdx <= 0){ msg('没有可撤销的操作'); return; }
  _histIdx--;
  histRestore(_hist[_histIdx]);
  msg('↩️ 已撤销');
}
function redo(){
  if(_histIdx >= _hist.length - 1){ msg('没有可重做的操作'); return; }
  _histIdx++;
  histRestore(_hist[_histIdx]);
  msg('↪️ 已重做');
}

function save() {
  pushHist();
  try { localStorage.setItem('s57v2', JSON.stringify(D)); localStorage.setItem('s57ts', String(Date.now())); } catch(e){}
  // 自动保存到云端（防抖）
  if(window._saveTimer) clearTimeout(window._saveTimer);
  window._saveTimer=setTimeout(cloudSave, 500);
}

// 页面加载时：localStorage优先，没有数据再从云端恢复
(function(){
  var hasLocal=false;
  try { hasLocal=!!localStorage.getItem('s57v2'); } catch(e){}
  if(hasLocal) {
    // 有本地数据，后台静默同步云端（如果有更新的数据）
    cloudLoad(function(data, cloudTs){
      var localTs = parseInt(localStorage.getItem('s57ts') || '0');
      if (cloudTs > localTs) {
        D = data;
        if(!D.colHeaders) D.colHeaders={};
        localStorage.setItem('s57v2', JSON.stringify(D));
        localStorage.setItem('s57ts', String(cloudTs));
        render();
        msg('已同步云端最新数据');histInit();
      }
    });
    return;
  }

  // 首次访问或无本地数据，尝试从云端恢复
  cloudLoad(function(data, cloudTs){
    D=data;
    if(!D.colHeaders) D.colHeaders={};
    localStorage.setItem('s57v2', JSON.stringify(D));
    localStorage.setItem('s57ts', String(cloudTs));
    render();
    msg('已恢复云端保存的数据');histInit();
  });
})();

var _firstRender = true;
function render(){
  migrateCols();
  ensureRowCols();
  drawH();
  updateMonths();
  var tb = $('tb');
  var filtered = getFilteredRows();
  if(!filtered.length){
    tb.innerHTML='<tr><td colspan="'+(9+D.batch.length)+'" style="padding:32px 24px;color:var(--text-muted);font-size:13px">暂无排班数据</td></tr>';
    $('st').textContent='0行';
    return;
  }
  var lookup={}; for(var i=0;i<D.rows.length;i++) lookup[D.rows[i].d]=i;
  var h = '';
  for(var di=0;di<filtered.length;di++){
    var ri = lookup[filtered[di].d];
    var r = D.rows[ri];
    var delay = di*25;
    var checked = _sel[ri] ? ' checked' : '';
    
    // 构建每列（透明背景，可标色）
    var MARK = {red:'#fecaca', yellow:'#fef9c3', green:'#dcfce7', blue:'#dbeafe'};
    function cellBg(k){ var mk = r.mark && r.mark[k]; return (mk && MARK[mk]) || 'transparent'; }
    function tg(n,c){ return '<span class="tg" style="background:'+c+'">'+esc(n)+'</span>'; }
    
    function wCell(k, ci){
      var arr = r[k]||[];
      var txt = arr.length ? arr.map(function(x){return tg(x,'transparent');}).join('') : '<span style="color:var(--gray-300)">—</span>';
      return '<td class="cl" style="background:'+cellBg(k)+'" onclick="pkW('+ri+','+ci+')" title="左键编辑">'+txt+'</td>';
    }
    function pCell(k){
      var arr = r[k]||[];
      var txt = arr.length ? arr.map(function(x){
        var c = x.f ? 'var(--red)' : 'transparent';
        return tg(x.n, c);
      }).join('') : '<span style="color:var(--gray-300)">—</span>';
      return '<td class="cl" style="background:'+cellBg(k)+'" onclick="pkP('+ri+',\''+k+'\')" title="左键编辑">'+txt+'</td>';
    }
    
    var animStyle = _firstRender ? 'animation:rowIn 250ms var(--ease-out) both;animation-delay:'+(di*25)+'ms;' : '';
    h += '<tr style="'+animStyle+'" oncontextmenu="delRow('+ri+');return false">';
    h += '<td class="cbtd"><input type="checkbox" onchange="toggleSel('+ri+')"'+checked+'></td>';
    h += '<td style="position:sticky;left:0;z-index:5;background:'+((r.mark&&r.mark.d&&MARK[r.mark.d])||'var(--bg)')+';min-width:105px;white-space:nowrap" oncontextmenu="delRow('+ri+');return false">'+esc(r.d)+'</td>';
    for(var bi=0; bi<D.batch.length; bi++) h += wCell('w'+bi, bi);
    h += pCell('e')+pCell('mb')+pCell('mp');
    h += pCell('s1')+pCell('s2')+pCell('bn')+pCell('of');
    h += '</tr>';
  }
  tb.innerHTML = h;
  $('st').textContent = filtered.length+'行 (全部'+D.rows.length+'行)';
  updateSelUI();
  _firstRender = false;
}

function updateRangeInfo(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(!d1 || !d2){ $('rangeInfo').textContent=''; return; }
  if(d1 > d2){ $('rangeInfo').textContent='开始>结束'; return; }
  var diff = (new Date(d2) - new Date(d1)) / 86400000 + 1;
  $('rangeInfo').textContent = diff>1 ? '共 '+diff+' 天' : '';
}
function addBatchRows(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(!d1 || !d2){ msg('选日期'); return; }
  if(d1 > d2){ msg('开始日期大于结束日期'); return; }
  var added = 0;
  var cur = new Date(d1);
  var end = new Date(d2);
  while(cur <= end){
    var ds = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    var d = sl(ds);
    var exists = false;
    for(var i=0;i<D.rows.length;i++){ if(D.rows[i].d===d){ exists=true; break; } }
    if(!exists){
      D.rows.push(newRow(d));
      added++;
    }
    cur.setDate(cur.getDate()+1);
  }
  if(!added){ msg('全部已存在'); return; }
  D.rows.sort(function(a,b){ return a.d>b.d?1:(a.d<b.d?-1:0); });
  save(); render(); msg('添加 '+added+' 天');
}

// ===== 添加/删除单行 =====
function addRow(){
  var d1 = $('d').value, d2 = $('d2').value;
  if(d2 && d1 !== d2){ addBatchRows(); return; }
  var d = $('d').value;
  if(!d){ msg('选日期'); return; }
  d = sl(d);
  for(var i=0;i<D.rows.length;i++){ if(D.rows[i].d===d){ msg('已存在'); return; } }
  D.rows.push(newRow(d));
  D.rows.sort(function(a,b){ return a.d>b.d?1:(a.d<b.d?-1:0); });
  save(); render(); msg('已添加');
}

function pkP(ri, key){
  _ctx = {ri:ri, key:key, mode:'person'};
  var r = D.rows[ri];
  var cur = r[key]||[];
  var ns = {};
  var keys=['e','mb','mp','s1','s2','bn','of'];
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};
  for(var k=0;k<keys.length;k++) ns[keys[k]] = (D.colHeaders&&D.colHeaders[keys[k]]) || defs[keys[k]];
  var icons={e:'☀️',mb:'🍱',mp:'⏰',s1:'🌆',s2:'🌃',bn:'🌙',of:'😴'};
  $('mxt').innerHTML = '<span class="mh-icon">'+(icons[key]||'👤')+'</span>'+r.d+' — '+ns[key];
  $('mxh').textContent = '点击选人·灰色+虚线=已排别班·双击强制(红色)';
  gridP(cur, key, ri);
  $('mxn').placeholder = '新姓名';
  $('mx').className = 'm s';
  updateFooterBt();
}
function gridP(cur, key, ri){
  var r = D.rows[ri]; if(!r) return;
  var allKeys = ['e','mb','mp','s1','s2','bn','of'];
  var h = '';
  for(var i=0;i<D.people.length;i++){
    var n = D.people[i];
    var inCur = cur.some(function(x){ return x.n===n; });
    var inOther = false;
    for(var j=0;j<allKeys.length;j++){
      if(allKeys[j]===key) continue;
      // 蓝/紫 与 早班 不互斥
      if((key==='mb'||key==='mp') && allKeys[j]==='e') continue;
      if(key==='e' && (allKeys[j]==='mb'||allKeys[j]==='mp')) continue;
      if(r[allKeys[j]] && r[allKeys[j]].some(function(x){ return x.n===n; })){ inOther=true; break; }
    }
    var cls = '';
    if(inCur) cls = ' s';
    else if(inOther) cls = ' fd';
    var onclick = inOther ? "pkPForce('"+esc(n)+"')" : "pkPClick('"+esc(n)+"')";
    h += '<div class="'+cls+'" onclick="'+onclick+'">'+esc(n)+'<span class="chip-x" onclick="event.cancelBubble=true;mdDelPerson(\''+esc(n)+'\')">✕</span></div>';
  }
  $('mxg').innerHTML = h;
}
function pkPClick(n){
  var r = D.rows[_ctx.ri]; if(!r) return;
  var cur = r[_ctx.key]||[];
  var idx = cur.findIndex(function(x){ return x.n===n; });
  if(idx>=0) cur.splice(idx,1); else cur.push({n:n,f:0});
  gridP(cur, _ctx.key, _ctx.ri);
}
function pkPForce(n){
  var r = D.rows[_ctx.ri]; if(!r) return;
  var cur = r[_ctx.key]||[];
  var idx = cur.findIndex(function(x){ return x.n===n; });
  if(idx>=0){ cur.splice(idx,1); }else{ cur.push({n:n,f:1}); msg('强制排班 '+n); }
  gridP(cur, _ctx.key, _ctx.ri);
}

  var i = D.people.indexOf(n); if(i<0) return;
  customConfirm('删除人员 "'+n+'"？',function(){
    D.people.splice(i,1); save();

  var stats={};
  D.people.forEach(function(n){ stats[n]={morning:0,evening:0,night:0,off:0}; });
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};
  // 按人按天去重：同一个人在同一天同一个班次类别只计一次
  // mb(中午值班)/mp(延迟吃饭)是早班的附加职责，不单独计班次
  for(var i=0;i<D.rows.length;i++){
    var r=D.rows[i]; if(!r) continue;
    D.people.forEach(function(nm){
      var m=(r.e||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.mb||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.mp||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var e=(r.s1||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;}) ||
            (r.s2||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var n=(r.bn||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      var f=(r.of||[]).some(function(p){return (typeof p==='object'?p.n:p)===nm;});
      if(stats[nm]){
        if(m) stats[nm].morning++;
        if(e) stats[nm].evening++;
        if(n) stats[nm].night++;
        if(f) stats[nm].off++;
      }
    });
  }
  return stats;
}

// ===== 导出（ExcelJS纯前端） =====
function exp(){
  if(!D.rows.length){ msg('无数据'); return; }

  var nB = D.batch.length, ncol = 4 + nB;
  var shiftKeys=['e','mb','mp','s1','s2','bn','of'];
  var defs={e:'早班',mb:'中午值班',mp:'延迟吃饭',s1:'小夜1:30',s2:'小夜3:30',bn:'大夜',of:'休班'};

  function grp(k){
    var n=(D.colHeaders&&D.colHeaders[k])||defs[k]||k;
    if(n.indexOf('早')>=0||k==='e'||k==='mb'||k==='mp') return 'morning';
    if(n.indexOf('小夜')>=0||k==='s1'||k==='s2') return 'evening';
    if(n.indexOf('大夜')>=0||k==='bn') return 'night';
    if(n.indexOf('休')>=0||k==='of') return 'off';
    return 'morning';
  }
  function buildRow(r){
    // 用Set去重：mb/mp与早班在同一组，避免同一人重复出现
    var gs={morning:new Set(),evening:new Set(),night:new Set(),off:new Set()};
    shiftKeys.forEach(function(k){
      (r[k]||[]).forEach(function(p){
        var nm=(typeof p==='object')?p.n+(p.f?'(强)':''):String(p);
        var g=grp(k);
        if(g && gs[g]) gs[g].add(nm);
      });
    });
    var arr=[r.d];
    for(var i=0;i<nB;i++) arr.push((r['w'+i]||[]).join('\n'));
    arr.push([...gs.morning].join('、'),[...gs.evening].join('、'),[...gs.night].join('、'),[...gs.off].join('、'));
    return arr;
  }
  var mRows={};
  D.rows.forEach(function(r){
    var mk=r.d.substring(0,7);
    if(!mRows[mk]) mRows[mk]=[];
    mRows[mk].push(buildRow(r));
  });
  var months=Object.keys(mRows).sort();

  var wb=new ExcelJS.Workbook();
  wb.creator='57车间';

  var hdrFill={type:'pattern',pattern:'solid',fgColor:{argb:'FF007AFF'}};
  var hdrFont={name:'Microsoft YaHei',bold:true,size:11,color:{argb:'FFFFFFFF'}};
  var titleFont={name:'Microsoft YaHei',bold:true,size:14};
  var noteFont={name:'Microsoft YaHei',size:9,italic:true,color:{argb:'FF8E8E93'}};
  var dataFont={name:'Microsoft YaHei',size:10};
  var boldFont={name:'Microsoft YaHei',bold:true,size:10};
  var batchFills=[{type:'pattern',pattern:'solid',fgColor:{argb:'FFD5F5E3'}},{type:'pattern',pattern:'solid',fgColor:{argb:'FFD6E4F0'}},{type:'pattern',pattern:'solid',fgColor:{argb:'FFFEF9C3'}}];
  var thin={style:'thin',color:{argb:'FF000000'}};
  var borderAll={top:thin,left:thin,bottom:thin,right:thin};
  var center={horizontal:'center',vertical:'center',wrapText:true};
  var leftWrap={horizontal:'left',vertical:'center',wrapText:true};

  months.forEach(function(mk){
    var rows=mRows[mk];
    var dateRange=rows[0][0]+' ~ '+rows[rows.length-1][0];
    var ws=wb.addWorksheet(mk.replace('/','-'));
    var widths=[16];
    for(var i=0;i<nB;i++) widths.push(36);
    widths.push(30,30,30,16);
    widths.forEach(function(w,i){ ws.getColumn(i+1).width=w; });

    ws.mergeCells(1,1,1,ncol);
    var c1=ws.getCell('A1');
    c1.value='57车间排班表 ('+mk+')'; c1.font=titleFont; c1.alignment=center;
    ws.getRow(1).height=38;

    ws.mergeCells(2,1,2,ncol);
    var c2=ws.getCell('A2');
    c2.value='周期: '+dateRange; c2.font=noteFont;
    c2.alignment={horizontal:'left',vertical:'center'};
    ws.getRow(2).height=22;

    var hdrs=['日期'];
    for(var i=0;i<nB;i++) hdrs.push(D.batch[i]||('批号'+(i+1)));
    hdrs.push('早班人员','小夜班人员','大夜班人员','休班人员');
    var hr=ws.getRow(3); hr.height=30;
    hdrs.forEach(function(h,i){
      var cell=hr.getCell(i+1);
      cell.value=h; cell.font=hdrFont; cell.fill=hdrFill;
      cell.alignment=center; cell.border=borderAll;
    });

    rows.forEach(function(vals,idx){
      var rn=4+idx;
      var row=ws.getRow(rn);
      // 计算自适应行高
      var maxLines=1;
      vals.forEach(function(v,ci){
        if(ci===0) return; // 日期列
        var lines=(String(v).match(/\n/g)||[]).length+1;
        // 对人员列(索引4-7)也用、估算换行
        if(ci>=4 && v.indexOf('、')>=0){
          var est=Math.ceil(String(v).length/15);
          if(est>lines) lines=est;
        }
        if(lines>maxLines) maxLines=lines;
      });
      row.height=Math.max(72, maxLines*18);

      vals.forEach(function(v,i){
        var cell=row.getCell(i+1);
        cell.value=v; cell.font=dataFont; cell.border=borderAll;
        cell.alignment=i===0?center:leftWrap;
        if(i>=1&&i<=nB) cell.fill=batchFills[(i-1)%3];
      });
    });

    var sr=4+rows.length;
    ws.mergeCells(sr,1,sr,nB);
    var sc=ws.getCell(sr,1);
    sc.value='合计'; sc.font=boldFont; sc.alignment=center; sc.border=borderAll;
    for(var i=2;i<=ncol;i++){ ws.getCell(sr,i).border=borderAll; }
    var sc5=ws.getCell(sr,nB+1);
    sc5.value=mk+' -- '+rows.length+' 个工作日';
    sc5.font=dataFont; sc5.alignment=leftWrap; sc5.border=borderAll;
    ws.getRow(sr).height=25;

    ws.pageSetup.orientation='landscape';
    ws.pageSetup.fitToPage=true;
    ws.pageSetup.fitToWidth=1; ws.pageSetup.fitToHeight=0;
  });

  var stats=buildStats();
  var names=Object.keys(stats).filter(function(n){return D.people.indexOf(n)>=0;}).sort();
  var wsS=wb.addWorksheet('出勤统计');
  [12,8,8,8,8,8].forEach(function(w,i){ wsS.getColumn(i+1).width=w; });

  wsS.mergeCells(1,1,1,6);
  var st=wsS.getCell('A1');
  st.value='出勤统计'; st.font=titleFont; st.alignment=center;
  wsS.getRow(1).height=38;

  var sHdrs=['姓名','早班','小夜班','大夜班','休班','合计'];
  var sr2=wsS.getRow(2); sr2.height=26;
  sHdrs.forEach(function(h,i){
    var cell=sr2.getCell(i+1);
    cell.value=h; cell.font=hdrFont; cell.fill=hdrFill;
    cell.alignment=center; cell.border=borderAll;
  });

  names.forEach(function(n,idx){
    var rn=3+idx;
    var row=wsS.getRow(rn); row.height=22;
    var s=stats[n];
    var vals=[n,s.morning||0,s.evening||0,s.night||0,s.off||0,s.morning+s.evening+s.night+s.off];
    vals.forEach(function(v,i){
      var cell=row.getCell(i+1);
      cell.value=v; cell.font=dataFont; cell.border=borderAll; cell.alignment=center;
    });
  });

  wb.xlsx.writeBuffer().then(function(buf){
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=window.URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='57车间排班表.xlsx';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    msg('导出成功');
  }).catch(function(e){ msg('导出失败'); console.error(e); });
}

// ===== 复制/粘贴功能 =====
var _clip = null;

function copyCell(){
  if(!_ctx) return;
  var r = D.rows[_ctx.ri]; if(!r) return;
  _clip = { type: _ctx.mode, key: _ctx.key, data: JSON.parse(JSON.stringify(r[_ctx.key]||[])) };
  msg('✅ 已复制'+(_clip.data.length||'空'));
  updateFooterBt();
}

function pasteCell(){
  if(!_clip||!_ctx){ msg('无内容可粘贴'); return; }
  if(_clip.key!==_ctx.key){ msg('类型不符，请复制同类型单元格'); return; }
  var r = D.rows[_ctx.ri]; if(!r) return;
  r[_ctx.key] = JSON.parse(JSON.stringify(_clip.data));
  save();
  if(_ctx.mode==='work') gridW(r[_ctx.key]||[]);
  else gridP(r[_ctx.key]||[], _ctx.key, _ctx.ri);
  msg('✅ 已粘贴');
}

function pasteToRange(){
  if(!_clip||!_ctx){ msg('无内容可粘贴'); return; }
  if(_clip.key!==_ctx.key){ msg('类型不符，请复制同类型单元格'); return; }
  customPrompt('粘贴到后续几天（含今天）？','3',function(days){
    if(!days) return;
    var n = parseInt(days);
    if(isNaN(n)||n<1){ msg('无效数字'); return; }
    var curIdx = -1;
    for(var i=0;i<D.rows.length;i++){ if(D.rows[i]&&D.rows[i].d===D.rows[_ctx.ri].d){ curIdx=i; break; } }
    if(curIdx<0) return;
    var pasted = 0;
    for(var i=curIdx;i<curIdx+n&&i<D.rows.length;i++){
      if(D.rows[i]){ D.rows[i][_clip.key]=JSON.parse(JSON.stringify(_clip.data)); pasted++; }
    }
    save(); render(); mdClose();
    msg('✅ 已粘贴到 '+pasted+' 天');
  });
}

function rClickW(ri,ci){
  var r = D.rows[ri]; if(!r) return false;
  var key = 'w'+ci;
  if(_clip && _clip.key===key){
    r[key] = JSON.parse(JSON.stringify(_clip.data));
    save(); render();
    msg('✅ 已粘贴工作内容');
  } else {
    _clip = { type:'work', key:key, data: JSON.parse(JSON.stringify(r[key]||[])) };
    msg('✅ 已复制工作内容 ('+(_clip.data.length||'空')+')');
  }
  return false;
}

function rClickP(ri,key){
  var r = D.rows[ri]; if(!r) return false;
  if(_clip && _clip.key===key){
    r[key] = JSON.parse(JSON.stringify(_clip.data));
    save(); render();
    msg('✅ 已粘贴班次');
  } else {
    _clip = { type:'person', key:key, data: JSON.parse(JSON.stringify(r[key]||[])) };
    msg('✅ 已复制班次 ('+(_clip.data.length||'空')+')');
  }
  return false;
}

function updateFooterBt(){
  var bt = $('mx').querySelector('.bt');

  h += '</div>';
  h += '<button class="btn btn-o btn-sm" onclick="copyCell()" title="复制当前安排">📋 复制</button>';
  if(canPaste){
    h += '<button class="btn btn-o btn-sm" onclick="pasteCell()" title="粘贴到当天">📝 粘贴</button>';
    h += '<button class="btn btn-o btn-sm" onclick="pasteToRange()" title="粘贴到连续多天">📝 粘后续</button>';

  h += '<button class="btn btn-o" onclick="mdCancel()">取消</button>';

  bt.innerHTML = h;
}

    if(!D.aiCols) D.aiCols = {};
    D.aiCols[variety] = c;
    D.batch.push(variety);
  }
  return c;
}
function newRow(ds){
  var nr = {d:ds,e:[],mb:[],mp:[],s1:[],s2:[],bn:[],of:[]};
  for(var i=0;i<D.batch.length;i++) nr['w'+i]=[];
  return nr;
}
function ensureRowCols(){
  for(var i=0;i<D.rows.length;i++){
    var r=D.rows[i]; if(!r) continue;
    for(var j=0;j<D.batch.length;j++){ if(!r['w'+j]) r['w'+j]=[]; }
    if(r.note) delete r.note;
  }
}
function migrateCols(){
  // 旧顺序 [LNF2529,利妥昔,LNF2501] → 固定顺序 [利妥昔,LNF2501,LNF2529]（数据跟着批号走，一次迁移）
  var old = ['LNF2529','利妥昔','LNF2501'];
  if(D.batch && D.batch.length===3 && D.batch[0]===old[0] && D.batch[1]===old[1] && D.batch[2]===old[2]){
    D.batch = ['利妥昔','LNF2501','LNF2529'];
    for(var i=0;i<D.rows.length;i++){
      var r = D.rows[i]; if(!r) continue;
      var w0=r.w0, w1=r.w1, w2=r.w2;
      r.w0 = w1; r.w1 = w2; r.w2 = w0;
      if(r.mark){
        var m0=r.mark.w0, m1=r.mark.w1, m2=r.mark.w2, nm={};
        for(var k in r.mark){ if(k!=='w0'&&k!=='w1'&&k!=='w2') nm[k]=r.mark[k]; }
        nm.w0=m1; nm.w1=m2; nm.w2=m0;
        r.mark = nm;
      }
    }
    save();
  }
}

function aiRun(inputs, counts, doMbMp, overwrite){
  var nightChain = {};
  var prevBN = null;   // 昨天大夜名单
  var streaks = {};    // 每人连续夜班天数
  // 生成前自动备份，可随时恢复
  try{ localStorage.setItem('s57aibak', JSON.stringify(D)); }catch(e){}
  var byDate = {};
  for(var i=0;i<D.rows.length;i++){
    if(D.rows[i] && D.rows[i].d) byDate[D.rows[i].d] = D.rows[i];
  }
  var newCnt = 0, overCnt = 0, skipCnt = 0;
  inputs.forEach(function(inp){
    inp.col = aiEnsureCol(inp.variety);
    if(inp.batch && inp.batch !== D.batch[inp.col]) D.batch[inp.col] = inp.batch;
    var tpl = AI_TEMPLATES[inp.variety] || AI_TEMPLATES['_default'];
    for(var day=0; day<tpl.total; day++){
      var ds = sl(fmtD(addDays(new Date(inp.date), day)));
      var work = [], lv = 1;
      tpl.stages.forEach(function(st){
        var on = st.step ? (day>=st.from && day<=st.to && ((day-st.from)%st.step===0)) : (day>=st.from && day<=st.to);
        if(on){
          if(day === st.from && st.mark) work.push(st.mark);
          work.push(st.w);
          if(st.lv>lv) lv=st.lv;
        }
      });
      var existing = byDate[ds];
      if(existing && !overwrite && (existing['w'+inp.col]||[]).length){ skipCnt++; return; }
      var row = existing || newRow(ds);
      row['w'+inp.col] = work;
      // 不覆盖模式：已有人员安排的行，只补工作内容，绝不动人员
      var hasPeople = ['e','mb','mp','s1','s2','bn','of'].some(function(k){ return (row[k]||[]).length>0; });
      if(!(existing && !overwrite && hasPeople)){
        var prevDate = sl(fmtD(addDays(new Date(inp.date), day - 1)));
        var ctx = {weekday: new Date(ds).getDay(), prevBN: prevBN, streaks: streaks};
        var asg = aiAssign(day, counts, lv, doMbMp, nightChain[prevDate], ctx);
        if(asg.s && asg.s.length) nightChain[ds] = asg.s[0];
        var nightToday = {};
        (asg.s||[]).concat(asg.bn||[]).forEach(function(x){ nightToday[x] = 1; });
        D.people.forEach(function(p){ streaks[p] = nightToday[p] ? ((streaks[p]||0) + 1) : 0; });
        prevBN = asg.bn.slice();
        row.e  = asg.e.map(function(n){ return {n:n,f:0}; });
        row.mb = asg.mb.map(function(n){ return {n:n,f:0}; });
        row.mp = asg.mp.map(function(n){ return {n:n,f:0}; });
        row.s1 = [];
        row.s2 = asg.s.map(function(n){ return {n:n,f:0}; });
        row.bn = asg.bn.map(function(n){ return {n:n,f:0}; });
        row.of = asg.of.map(function(n){ return {n:n,f:0}; });
      }
      if(existing) overCnt++; else { byDate[ds]=row; newCnt++; }
    }
  });
  Object.keys(byDate).forEach(function(ds){
    var has = false;
    for(var i=0;i<D.rows.length;i++){ if(D.rows[i] && D.rows[i].d===ds){ has=true; break; } }
    if(!has) D.rows.push(byDate[ds]);
  });
  D.rows.sort(function(a,b){ return a.d>b.d?1:(a.d<b.d?-1:0); });
  save(); render();
  msg('✅ AI排班完成：新增 '+newCnt+' 天，覆盖 '+overCnt+' 天'+(skipCnt?('，跳过 '+skipCnt+' 天已有内容'):''));
}

function aiRules(){
  // 自动理解排班规则（自然语言）：
  // - 谁不排班/不排小夜大夜/只排早班、每班人数
  // - X和Y固定搭班 / X和Y不能同班（错开）
  // - 不能连续排夜班 / 最多连排N天夜班
  // - 大夜后必须转早班/休息
  // - X每周三休 / X周三不排
  var R = {noAll:[], noS:[], noBN:[], onlyM:[], counts:null, binds:[], separates:[], maxNight:null, afterBig:false, dayOff:[]};
  var cnt = null;
  var dayMap = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
  (D.rules||[]).forEach(function(txt){
    var s = String(txt||'').replace(/[\s，。；;、,]+/g,'');
    if(!s) return;
    // 每班人数
    var me = s.match(/早班(\d+)人/), ms = s.match(/小夜(\d+)人/), mb = s.match(/大夜(\d+)人/);
    if(me||ms||mb){ if(!cnt) cnt={e:null,s:null,bn:null}; if(me) cnt.e=+me[1]; if(ms) cnt.s=+ms[1]; if(mb) cnt.bn=+mb[1]; }
    // 人员班次限制
    var noAll = /(不排班|自己排|自己定|组长|不参与)/.test(s);
    var noSmall = /不排小夜|不上小夜/.test(s);
    var noBig = /不排大夜|不上大夜/.test(s);
    var noNight = (/不排夜|不上夜|不排夜班/.test(s)) && !noSmall && !noBig;
    var onlyM = /只排早班|只上早班|只白班/.test(s);
    // 搭班 / 错开
    var negPair = /(不能|不要|别|错开|不一起|不同班|分开)/.test(s);
    var posPair = /(一起|搭班|同班|固定排|绑定)/.test(s);
    var namesIn = D.people.filter(function(p){ return s.indexOf(p) >= 0; });
    if(namesIn.length >= 2){
      if(negPair && R.separates.length < 6) R.separates.push([namesIn[0], namesIn[1]]);
      else if(posPair && R.binds.length < 6) R.binds.push([namesIn[0], namesIn[1]]);
    }
    // 连续夜班上限
    var mn = s.match(/最多(?:连(?:续)?(?:排|上)?)(\d+)(?:天)?(?:的)?(?:小夜|大夜|夜班)/) ||
             s.match(/(?:小夜|大夜|夜班)(?:最多|只能)(?:连(?:续)?(?:排|上)?)(\d+)天/) ||
             s.match(/(?:小夜|大夜|夜班)(?:不能|不要)(?:连续)?(?:排|上)?(?:超过)?(\d+)天/);
    if(mn) R.maxNight = Math.max(1, +mn[1]);
    if(R.maxNight === null && /(?:不能|不要|禁止)(?:连续)?(?:排|上)?(?:小夜|大夜|夜班)/.test(s)) R.maxNight = 1;
    // 大夜后转早班/休息
    if(/(?:大夜|夜班)(?:后|之后)(?:必须|要|只能|应|一定)(?:转|排)?(?:早班|休息|休)/.test(s) || /大夜后不排/.test(s)) R.afterBig = true;
    // 按星期休 / 人员限制
    D.people.forEach(function(p){
      if(s.indexOf(p) < 0) return;
      var m = s.match(p + '(?:每周|周|星期)([一二三四五六日天])(?:不排|休|休息|不上班)');
      if(m && dayMap[m[1]] !== undefined) R.dayOff.push({p:p, d:dayMap[m[1]]});
      if(noAll && R.noAll.indexOf(p)<0) R.noAll.push(p);
      if((noSmall||noNight) && R.noS.indexOf(p)<0) R.noS.push(p);
      if((noBig||noNight) && R.noBN.indexOf(p)<0) R.noBN.push(p);
      if(onlyM && R.onlyM.indexOf(p)<0) R.onlyM.push(p);
    });
  });
  R.counts = cnt;
  return R;
}

function aiAssign(day, counts, lv, doMbMp, prevSmall, ctx){
  // 组长不自动排班；女生不排小夜/大夜；全员上班（不排休班）；遵守排班规则（自动理解）
  var needS = lv>=2, needBN = lv>=3;
  ctx = ctx || {weekday:0, prevBN:[], streaks:{}};
  var R = aiRules();
  var workers = D.people.filter(function(p){
    if(_aiLead.indexOf(p) >= 0) return false;
    if(R.noAll.indexOf(p) >= 0) return false;
    if(R.dayOff.some(function(o){ return o.p===p && o.d===ctx.weekday; })) return false;
    return true;
  });
  var nightBase = workers.filter(function(p){ return _aiFem.indexOf(p) < 0 && R.onlyM.indexOf(p) < 0; });
  var prevNightNames = ctx.prevBN || [];
  var sPool = nightBase.filter(function(p){
    if(R.noS.indexOf(p) >= 0) return false;
    if(R.afterBig && prevNightNames.indexOf(p) >= 0) return false;
    if(R.maxNight && (ctx.streaks[p] || 0) >= R.maxNight) return false;
    return true;
  });
  var bnPool = nightBase.filter(function(p){
    if(R.noBN.indexOf(p) >= 0) return false;
    if(R.afterBig && prevNightNames.indexOf(p) >= 0) return false;
    if(R.maxNight && (ctx.streaks[p] || 0) >= R.maxNight) return false;
    return true;
  });
  var res = {e:[],s:[],bn:[],of:[],mb:[],mp:[]};
  if(!workers.length) return res;
  // 小夜/大夜人数：有活按配置；没活至少1人连班值守
  var sN = needS ? Math.min(counts.s, sPool.length) : 1;
  var bnN = needBN ? Math.min(counts.bn, Math.max(0, bnPool.length - sN)) : 1;
  if(sN + bnN > nightBase.length){ sN = Math.max(1, nightBase.length - bnN); }
  if(sN + bnN > nightBase.length){ bnN = Math.max(0, nightBase.length - sN); }
  sN = Math.max(0, Math.min(sN, sPool.length));
  bnN = Math.max(0, Math.min(bnN, bnPool.length));
  if(sN + bnN > nightBase.length){ bnN = Math.max(0, nightBase.length - sN); }
  var taken = {};
  var rotS = rotateArr(sPool.slice(), day);
  var rotBN = rotateArr(bnPool.slice(), day);
  var rotAll = rotateArr(workers.slice(), day);
  // 大夜：优先昨天小夜的人（连班，如今天小夜=明天大夜）
  if(prevSmall && bnPool.indexOf(prevSmall) >= 0){ res.bn.push(prevSmall); taken[prevSmall] = 1; }
  fillRot(rotBN, res.bn, bnN, taken, 0);
  // 小夜：剩余夜班池轮转
  fillRot(rotS, res.s, sN, taken, 0);
  // 早班：其余所有人（小夜/大夜没事的都排早班）
  fillRot(rotAll, res.e, rotAll.length - res.s.length - res.bn.length, taken, 0);
  // 搭班/错开修正（res 里存的是名字字符串）
  function shiftOf(nm){
    if(res.e.indexOf(nm) >= 0) return 'e';
    if(res.s.indexOf(nm) >= 0) return 's';
    if(res.bn.indexOf(nm) >= 0) return 'bn';
    return '';
  }
  function removeP(arr, nm){
    var i = arr.indexOf(nm);
    if(i >= 0){ arr.splice(i,1); return true; }
    return false;
  }
  R.binds.forEach(function(g){
    for(var k=0;k<2;k++){
      var a=g[k], b=g[1-k];
      var sa = shiftOf(a), sb = shiftOf(b);
      if(!sa) continue;
      if(sa==='e' && workers.indexOf(b) >= 0 && !taken[b]){ res.e.push(b); taken[b]=1; }
      else if(sa==='s' && sPool.indexOf(b) >= 0 && !taken[b]){ res.s.push(b); taken[b]=1; }
      else if(sa==='bn' && bnPool.indexOf(b) >= 0 && !taken[b]){ res.bn.push(b); taken[b]=1; }
      else if(sb && sb !== sa){
        removeP(res[sb], b);
        if(sa==='e' && workers.indexOf(b) >= 0){ res.e.push(b); }
        else if(sa==='s' && sPool.indexOf(b) >= 0){ res.s.push(b); }
        else if(sa==='bn' && bnPool.indexOf(b) >= 0){ res.bn.push(b); }
      }
    }
  });
  R.separates.forEach(function(g){
    var a=g[0], b=g[1];
    var sa = shiftOf(a), sb = shiftOf(b);
    if(sa && sa===sb){
      removeP(res[sb], b);
      if(sb !== 'e' && workers.indexOf(b) >= 0){ res.e.push(b); }
      else if(sb !== 's' && sPool.indexOf(b) >= 0){ res.s.push(b); }
      else if(sb !== 'bn' && bnPool.indexOf(b) >= 0){ res.bn.push(b); }
    }
  });
  // 中午值班/延迟吃饭：从早班前两人中选
  if(doMbMp && res.e.length >= 2){
    res.mb = [res.e[0]];
    res.mp = [res.e[1]];
  }
  return res;
}
function rotateArr(arr, k){
  if(!arr.length) return arr;
  var a = arr.slice();
  for(var i=0;i<k;i++) a.push(a.shift());
  return a;
}
function fillRot(pool, out, cnt, taken, startIdx){
  var i = startIdx || 0, guard = 0;
  while(out.length < cnt && guard < pool.length * 4){
    var p = pool[i % pool.length];
    if(!taken[p]){ out.push(p); taken[p] = 1; }
    i++; guard++;
  }
}
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function fbOpen(){
  if(!D.feedback) D.feedback = [];
  $('mxt').innerHTML = '<span class="mh-icon">📮</span>排班反馈';
  $('mxh').textContent = '发现AI自动排班有误？选日期写下正确内容，提交后保存到云端，AI下次上线会自动读取修正';
  var h = '';
  h += '<section id="fbBox" class="fb-form">';
  h += '<div class="fb-sec">📅 日期纠错（当天排班有误）</div>';
  h += '<div class="fb-row">';
  h += '<input type="date" class="inp" id="fbDate" style="width:132px" value="'+today()+'">';
  h += '<button class="btn btn-g btn-sm" onclick="fbAdd()">提交反馈</button>';
  h += '</div>';
  h += '<textarea id="fbText" placeholder="例如：8月5日 LNF2501 应下罐但实际推迟到8月6日；或某天某列工作内容不对…"></textarea>';
  h += '<div class="fb-list" id="fbList"></div>';
  h += '<div class="fb-sec">📏 排班规则（长期生效，AI排班自动遵守）</div>';
  h += '<textarea id="fbRule" placeholder="例如：王征征不排大夜；林新燕只排早班；小夜5人、大夜2人；张峰不排班自己排…"></textarea>';
  h += '<div class="fb-row"><button class="btn btn-p btn-sm" onclick="fbAddRule()">保存规则</button></div>';
  h += '<div class="fb-list" id="fbRuleList"></div>';
  h += '</section>';
  $('mxg').innerHTML = h;
  $('mxg').style.maxHeight = '60vh';
  $('mxn').style.display = 'none';
  var ab = $('mx').querySelector('.ab'); if(ab) ab.style.display='none';
  var bt = $('mx').querySelector('.bt');
  bt.innerHTML = '<button class="btn btn-o btn-sm" onclick="fbRestore()" title="恢复上次AI生成前备份">↩️ 恢复备份</button><button class="btn btn-o" onclick="mdClose()">关闭</button>';
  $('mx').className = 'm s';
  fbRender();
  fbRuleRender();
}
function fbRender(){
  var box = $('fbList'); if(!box) return;
  if(!D.feedback || !D.feedback.length){
    box.innerHTML = '<div style="color:var(--gray-400);text-align:center;padding:10px">暂无反馈</div>';
    return;
  }
  box.innerHTML = D.feedback.map(function(f, i){
    return '<div class="fb-item"><span class="fb-d">'+esc(f.d||'')+'</span><span class="fb-c">'+esc(f.c||'')+'</span><span class="fb-x" onclick="fbDel('+i+')" title="删除">✕</span></div>';
  }).join('');
}
function fbAdd(){
  var d = $('fbDate').value;
  var c = $('fbText').value.trim();
  if(!d || !c){ msg('请选择日期并填写反馈内容'); return; }
  if(!D.feedback) D.feedback = [];
  D.feedback.push({d:sl(d), c:c, t:Date.now()});
  save();
  $('fbText').value = '';
  fbRender();
  msg('✅ 反馈已提交并保存到云端');
}
function fbDel(i){
  customConfirm('删除这条反馈？', function(){
    D.feedback.splice(i,1);
    save();
    fbRender();
    msg('已删除反馈');
  });
}
function fbRuleRender(){
  var box = $('fbRuleList'); if(!box) return;
  if(!D.rules || !D.rules.length){
    box.innerHTML = '<div style="color:var(--gray-400);text-align:center;padding:8px">暂无排班规则</div>';
    return;
  }
  box.innerHTML = D.rules.map(function(t, i){
    return '<div class="fb-item"><span class="fb-c" style="flex:1">📏 '+esc(t)+'</span><span class="fb-x" onclick="fbDelRule('+i+')" title="删除">✕</span></div>';
  }).join('');
}
function fbAddRule(){
  var c = $('fbRule').value.trim();
  if(!c){ msg('请填写排班规则'); return; }
  if(!D.rules) D.rules = [];
  D.rules.push(c);
  save();
  $('fbRule').value = '';
  fbRuleRender();
  msg('✅ 规则已保存，AI排班会自动遵守');
}
function fbDelRule(i){
  customConfirm('删除这条规则？', function(){
    D.rules.splice(i,1);
    save();
    fbRuleRender();
    msg('已删除规则');
  });
}

function fbRestore(){
  var bak = null;
  try{ bak = localStorage.getItem('s57aibak'); }catch(e){}
  if(!bak){ msg('没有找到AI生成前的备份'); return; }
  customConfirm('恢复上次AI生成前的备份？当前所有数据会被覆盖！', function(){
    try{
      var d = JSON.parse(bak);
      if(!d || !d.people){ msg('备份数据无效'); return; }
      D = d;
      if(!D.colHeaders) D.colHeaders = {};
      save(); render(); msg('✅ 已恢复AI生成前备份');
    }catch(e){ msg('备份恢复失败'); }
  });
}
